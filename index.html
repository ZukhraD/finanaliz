<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data: blob:; connect-src blob: data:">
<title>Финансовый анализ РК</title>
<style>:root {
  --paper: #F3F6F6; --surface: #FFFFFF; --ink: #17262E; --muted: #5B6B73; --rule: #D5DDE0; --rule-soft: #E7ECEE;
  --teal: #0E5A66; --teal-ink: #0A4650; --teal-soft: #E1EEF0;
  --in-bg: #FFF7D6; --in-ink: #1F4FB8; --calc-bg: #F1F4F5;
  --ok: #2F7A4B; --ok-bg: #E2F1E7; --chk: #9A5B00; --chk-bg: #FBF0D6; --risk: #B9410C; --risk-bg: #FCE6DA;
  --crit: #9B1C3A; --crit-bg: #F7DCE3; --nd: #66727A; --nd-bg: #ECEFF1;
  --serif: "Lora", Georgia, "Times New Roman", serif;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --r: 6px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 26px; line-height: 1.2; }
h2 { font-size: 19px; line-height: 1.3; }
h3 { font-size: 16px; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
a { color: var(--teal); }

/* shell */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.rail { background: var(--teal-ink); color: #DCEBEC; padding: 22px 14px 18px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.brand { font-family: var(--serif); font-size: 18px; color: #fff; line-height: 1.25; padding: 0 8px; }
.brand small { display: block; font-family: var(--sans); font-size: 12px; color: #9EC3C7; margin-top: 4px; }
.rail .client { padding: 10px 8px; border-top: 1px solid #1F6670; border-bottom: 1px solid #1F6670; }
.rail .client b { color: #fff; display: block; font-weight: 600; }
.rail .client button { background: none; border: 0; color: #9EC3C7; padding: 0; cursor: pointer; font-size: 12.5px; margin-top: 4px; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li { margin: 1px 0; }
.steps button { width: 100%; text-align: left; background: none; border: 0; color: #DCEBEC; padding: 8px 8px 8px 36px; border-radius: var(--r); cursor: pointer; position: relative; }
.steps li.num button::before { counter-increment: s; content: counter(s); position: absolute; left: 8px; top: 7px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid #4E8C93; font-size: 11.5px; display: grid; place-items: center; color: #BFD9DB; }
.steps button:hover { background: #135560; }
.steps button[aria-current="page"] { background: #F3F6F6; color: var(--teal-ink); font-weight: 600; }
.steps button[aria-current="page"]::before { border-color: var(--teal); color: var(--teal); }
.steps .dot { position: absolute; right: 8px; top: 13px; width: 8px; height: 8px; border-radius: 50%; }
.rail .foot { margin-top: auto; font-size: 12px; color: #9EC3C7; padding: 0 8px; }
.rail .foot button { display: block; background: none; border: 0; color: #DCEBEC; padding: 5px 0; cursor: pointer; text-align: left; }
.main { min-width: 0; padding: 26px 32px 60px; }
.pagehead { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.pagehead .lead { flex: 1 1 380px; }
.pagehead p { color: var(--muted); max-width: 72ch; margin-top: 6px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* controls */
.btn { border: 1px solid var(--rule); background: var(--surface); padding: 7px 13px; border-radius: var(--r); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: #AEBCC1; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.primary:hover { background: var(--teal-ink); }
.btn.ghost { background: none; border-color: transparent; color: var(--teal); }
.btn.danger { color: var(--crit); }
label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
label.f > span { color: var(--muted); }
.inp, select.inp, textarea.inp { border: 1px solid var(--rule); background: var(--in-bg); color: var(--in-ink); border-radius: 4px; padding: 6px 8px; width: 100%; }
textarea.inp { min-height: 110px; resize: vertical; line-height: 1.5; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px 16px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 18px 20px; margin-bottom: 16px; }
.panel > h2 { margin-bottom: 12px; }
.panel .hint { color: var(--muted); font-size: 12.5px; margin: -6px 0 12px; max-width: 80ch; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--teal); color: #fff; }

/* data tables */
.tablewrap { overflow: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); max-height: calc(100vh - 210px); }
table.data { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
table.data th, table.data td { padding: 5px 10px; border-bottom: 1px solid var(--rule-soft); text-align: right; white-space: nowrap; }
table.data thead th { position: sticky; top: 0; background: #E9EFF0; z-index: 2; font-weight: 600; color: var(--teal-ink); border-bottom: 1px solid var(--rule); }
table.data th.lab, table.data td.lab { text-align: left; white-space: normal; position: sticky; left: 0; background: inherit; z-index: 1; min-width: 300px; max-width: 460px; }
table.data tbody tr { background: var(--surface); }
table.data thead th.lab { z-index: 3; }
table.data tr.sec td { background: var(--teal-soft); color: var(--teal-ink); font-weight: 600; text-align: left; font-size: 12.5px; padding-top: 9px; }
table.data tr.calc { background: var(--calc-bg); }
table.data tr.calc td.lab { font-weight: 600; }
table.data tr.sub td.lab { padding-left: 26px; color: #34464F; }
table.data td.cell { padding: 0; }
table.data td.cell input { width: 100%; min-width: 108px; border: 0; background: var(--in-bg); color: var(--in-ink); text-align: right; padding: 5px 10px; border-left: 1px solid #F4E7B0; }
table.data td.cell input:focus { background: #fff; outline: 2px solid var(--teal); outline-offset: -2px; }
table.data td.cell.opt input { background: #FFFBEA; }
table.data td.cell input.imp { box-shadow: inset 3px 0 0 #8BB8BE; }
table.data .neg { color: var(--crit); }
.pertitle { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); }

/* status */
.st { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.st.ok { background: var(--ok-bg); color: var(--ok); }
.st.chk { background: var(--chk-bg); color: var(--chk); }
.st.risk { background: var(--risk-bg); color: var(--risk); }
.st.crit { background: var(--crit-bg); color: var(--crit); }
.st.nd { background: var(--nd-bg); color: var(--nd); }

/* ratio map: the signature element */
table.rmap td.v { position: relative; min-width: 104px; }
table.rmap td.v span.val { position: relative; z-index: 1; }
table.rmap td.v.ok { background: var(--ok-bg); color: var(--ok); }
table.rmap td.v.chk { background: var(--chk-bg); color: var(--chk); }
table.rmap td.v.risk { background: var(--risk-bg); color: var(--risk); }
table.rmap td.v.crit { background: var(--crit-bg); color: var(--crit); font-weight: 600; }
table.rmap td.v.nd { color: var(--nd); }
table.rmap td.trend { width: 92px; padding: 2px 8px; }
table.rmap td.lab .formula { display: block; font-size: 12px; color: var(--muted); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: 10px 2px 0; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); margin-bottom: 16px; }
.facts div { padding: 12px 16px; border-right: 1px solid var(--rule-soft); }
.facts div:last-child { border-right: 0; }
.facts b { display: block; font-size: 19px; font-family: var(--serif); font-weight: 600; margin-top: 2px; }
.facts span { color: var(--muted); font-size: 12.5px; }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; border-bottom: 1px solid var(--rule); }
.tabs button { border: 0; background: none; padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); }
.tabs button[aria-selected="true"] { border-bottom-color: var(--teal); color: var(--ink); font-weight: 600; }

/* client list */
.clients { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.clients th, .clients td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--rule-soft); }
.clients th { background: #E9EFF0; color: var(--teal-ink); font-weight: 600; font-size: 13px; }
.clients td:last-child { text-align: right; white-space: nowrap; }
.empty { border: 1px dashed #AFC0C4; border-radius: 10px; padding: 34px; text-align: center; background: var(--surface); }
.empty h2 { margin-bottom: 6px; }

/* dialog */
dialog { border: 0; border-radius: 10px; padding: 0; width: min(680px, 94vw); box-shadow: 0 18px 60px rgba(10, 40, 46, .28); color: var(--ink); }
dialog::backdrop { background: rgba(14, 40, 46, .45); }
dialog .dh { padding: 18px 22px 6px; }
dialog .db { padding: 8px 22px 16px; max-height: 64vh; overflow: auto; }
dialog .df { padding: 12px 22px 18px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--rule-soft); }
.logline { padding: 6px 0; border-bottom: 1px solid var(--rule-soft); font-size: 13px; }
.drop { border: 2px dashed #AFC0C4; border-radius: 8px; padding: 18px; text-align: center; color: var(--muted); background: #FAFCFC; }
.drop.over { border-color: var(--teal); background: var(--teal-soft); }

.toast { position: fixed; bottom: 18px; right: 18px; background: var(--teal-ink); color: #fff; padding: 10px 16px; border-radius: 8px; box-shadow: 0 8px 26px rgba(0,0,0,.2); opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; z-index: 50; }
.toast.on { opacity: 1; transform: none; }
.saved { font-size: 12.5px; color: var(--muted); }
.concl-text { white-space: pre-wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; }
  .main { padding: 18px 16px 40px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  .rail, .toolbar, .noprint { display: none !important; }
  .app { display: block; }
  .main { padding: 0; }
  body { background: #fff; }
  .panel, .tablewrap { border: 0; max-height: none; overflow: visible; }
}
h1, h2, h3, .brand, .facts b { word-spacing: -0.14em; }
table.form th.lab, table.form td.lab { min-width: 56px; width: 56px; }
table.form td { text-align: left; padding: 6px 6px; }
table.form td .inp { min-width: 120px; }
table.form td input[data-f="name"], table.form td input[data-f="label"] { min-width: 230px; }
table.form td select[data-f="role"], table.form td select[data-f="regime"] { min-width: 170px; }
table.chk th:not(.lab), table.chk td:not(.lab) { width: 132px; text-align: center; }
.brand small { word-spacing: normal; }

/* ================= фирменный стиль: белый 70 · лазурно-синий 10 · лайм 10 · графит 5 · платина 5 ================= */
:root {
  --blue: #023DFF; --blue-ink: #0231CC; --blue-soft: #EEF2FF; --lime: #00BB00; --lime-ink: #067A06; --lime-soft: #E6F7E6;
  --graphite: #272727; --platinum: #E5E4E2; --white: #FFFFFF;
  --paper: #FFFFFF; --surface: #FFFFFF; --ink: #272727; --muted: #666666; --rule: #E5E4E2; --rule-soft: #EFEEEC;
  --teal: #023DFF; --teal-ink: #272727; --teal-soft: #F2F2F0;
  --in-bg: #EEF2FF; --in-ink: #0231CC; --calc-bg: #F6F6F5;
  --ok: #067A06; --ok-bg: #E6F7E6;
  --serif: "Futura PT", "Futura", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif;
  --sans: "Roboto", "Segoe UI", system-ui, Arial, sans-serif;
  --note: Verdana, Geneva, "DejaVu Sans", sans-serif;
  --shape: 22px 22px 22px 0;
}
h1, h2, h3, .brand, .facts b { font-family: var(--serif); font-weight: 600; letter-spacing: 0; word-spacing: normal; }
h1 { font-size: 28px; }
/* системные уточнения — Verdana */
.pagehead p, .panel .hint, .muted, .small, .pertitle, .saved, .legend, table.rmap td.lab .formula, label.f > span, .facts span, .brand small, .logline .small {
  font-family: var(--note); font-size: 11.5px; letter-spacing: 0; }
.pagehead p { font-size: 12.5px; line-height: 1.6; }

/* навигация: лазурно-синяя панель, лайм — текущий шаг */
.rail { background: var(--blue); color: #fff; }
.brand { color: #fff; } .brand small { color: #D6DFFF; }
.rail .client { border-color: rgba(255,255,255,.28); }
.rail .client button, .rail .foot, .rail .foot .saved { color: #D6DFFF; }
.steps button { color: #fff; }
.steps li.num button::before { border-color: rgba(255,255,255,.55); color: #fff; }
.steps button:hover { background: rgba(255,255,255,.12); }
.steps button[aria-current="page"] { background: #fff; color: var(--graphite); }
.steps button[aria-current="page"]::before { background: var(--lime); border-color: var(--lime); color: #fff; }
.steps .dot { box-shadow: 0 0 0 2px var(--blue); }
.rail .foot button { color: #fff; }

/* кнопки: синий — основное действие, графит — обводка */
.btn { border-color: var(--platinum); border-radius: 999px; padding: 7px 16px; }
.btn:hover { border-color: var(--graphite); }
.btn.primary { background: var(--blue); border-color: var(--blue); }
.btn.primary:hover { background: var(--blue-ink); }
.btn.ghost { color: var(--blue); }
.seg { border-radius: 999px; border-color: var(--platinum); }
.seg button[aria-pressed="true"] { background: var(--graphite); color: #fff; }
.tabs { border-bottom-color: var(--platinum); }
.tabs button[aria-selected="true"] { border-bottom: 3px solid var(--lime); color: var(--graphite); }

/* поверхности: фирменная форма — три скругления, один прямой угол */
.panel, .facts, .tablewrap, .empty, .clients { border-radius: var(--shape); border-color: var(--platinum); }
.facts { background: var(--white); border: 0; box-shadow: inset 0 0 0 1px var(--platinum); }
.facts div { border-right-color: var(--platinum); }
.facts div:first-child { background: var(--graphite); color: #fff; border-radius: 22px 0 0 0; }
.facts div:first-child span { color: #CFCFCF; }
.empty { border-style: solid; }

/* таблицы: шапка платиновая, разделы — тонкая лаймовая метка */
table.data thead th, .clients th { background: var(--platinum); color: var(--graphite); border-bottom-color: #D2D1CE; }
table.data tr.sec td { background: #fff; color: var(--graphite); border-bottom: 1px solid var(--platinum); box-shadow: inset 4px 0 0 var(--lime); text-transform: none; }
table.data td.cell input { border-left-color: #DCE4FF; }
table.data td.cell.opt input { background: #F6F8FF; }
table.data td.cell input.imp { box-shadow: inset 3px 0 0 var(--lime); }
.inp, select.inp, textarea.inp { border-color: #D6DEFF; }
:focus-visible { outline-color: var(--blue); }
table.data td.cell input:focus { outline-color: var(--blue); }

/* оценки: «норма» — лайм; остальные — функциональные цвета вне палитры (нужны для смысла) */
.st.ok { background: var(--lime-soft); color: var(--lime-ink); }
table.rmap td.v.ok { background: var(--lime-soft); color: var(--lime-ink); }
.drop { border-color: var(--platinum); background: #fff; border-radius: var(--shape); }
.drop.over { border-color: var(--blue); background: var(--blue-soft); }
.toast { background: var(--graphite); }
dialog { border-radius: var(--shape); }
.brand small { font-weight: 400; }
.app { grid-template-columns: 224px 1fr; }

/* проблемы и решения */
.pdot { position: absolute; right: 8px; top: 8px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 11.5px; font-weight: 700; display: none; place-items: center; line-height: 20px; text-align: center; }
.pdot.crit, .pdot.risk, .pdot.chk { display: inline-block; }
.pdot.crit { background: #FF4D4F; color: #fff; } .pdot.risk { background: #FFB020; color: #272727; } .pdot.chk { background: #fff; color: var(--blue); }
.steps button[aria-current="page"] .pdot.chk { background: var(--blue-soft); }
.probs { border: 1px solid var(--platinum); border-radius: var(--shape); padding: 12px 16px; margin-bottom: 14px; background: #fff; box-shadow: inset 4px 0 0 #FFB020; }
.probs-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.prob { display: grid; grid-template-columns: 112px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule-soft); align-items: start; }
.prob:first-of-type { border-top: 0; }
.prob .st { justify-self: start; }
.prob .fix { margin: 4px 0 0; color: #3A3A3A; font-size: 13px; }
.prob .fix::before { content: "Что сделать: "; font-weight: 600; color: var(--blue); }
.st.nd { background: var(--nd-bg); }
table.data td.cell input.bad { outline: 2px solid #FFB020; outline-offset: -2px; background: #FFF6E5; }
table.data td.cell input.bad-crit { outline-color: #FF4D4F; background: #FFEDED; }
table.data td.bad { box-shadow: inset 0 0 0 2px #FFB020; background: #FFF6E5; }
table.data td.bad-crit { box-shadow: inset 0 0 0 2px #FF4D4F; background: #FFEDED; }
table.data .code { display: inline-block; min-width: 34px; color: var(--blue); font-family: var(--note); font-size: 11px; }
table.data tr.sub td.lab { padding-left: 22px; }
/* прогноз */
.fcgrid { display: grid; grid-template-columns: minmax(380px, 1.1fr) 1fr; gap: 22px; align-items: start; }
.fcgrid h3, .panel h3 { font-size: 15px; margin-bottom: 8px; }
table.data.fc td.cell input, .inp.num { text-align: right; }
.inp.num.inl { width: 80px; display: inline-block; padding: 3px 6px; }
.grid2.tight { grid-template-columns: repeat(2, minmax(150px, 1fr)); gap: 10px 14px; }
.seas { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.seas .inp { padding: 5px 6px; }
.fcres { display: grid; grid-template-columns: minmax(420px, 1fr) minmax(360px, 1fr); gap: 22px; align-items: start; }
.chart { width: 100%; height: auto; }
.chart text { font-family: var(--note); font-size: 10px; fill: #666; }
.chart .grid { stroke: #EFEEEC; } .chart .zero { stroke: #272727; stroke-width: .8; }
.chart .buf { stroke: #FFB020; stroke-dasharray: 5 4; stroke-width: 1.4; }
.chart .b { fill: none; stroke: var(--blue); stroke-width: 2.4; } .chart .s { fill: none; stroke: var(--lime); stroke-width: 2.4; }
.legend .ln { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; }
.legend .ln.b { background: var(--blue); } .legend .ln.s { background: var(--lime); } .legend .ln.buf { background: #FFB020; }
table.data td.low { background: #FFF6E5; color: #9A5B00; font-weight: 600; }
@media (max-width: 1100px) { .fcgrid, .fcres { grid-template-columns: 1fr; } }
.rail .back { background: #fff; color: var(--blue); border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 600; cursor: pointer; text-align: left; }
.rail .back:hover { background: var(--lime); color: #fff; }
.copy { font-family: var(--note); font-size: 11px; color: #D6DFFF; margin: 10px 0 0; }
.main > .copy, body > .main .copy { color: #888; }
table.oked td:nth-child(3) .inp { min-width: 380px; }
table.oked td:nth-child(3) .small { display: block; margin-top: 3px; }
table.data th.yr { background: #D9D8D5; }
table.data td.yr { background: #F6F6F5; font-weight: 600; border-left: 1px solid #E5E4E2; }
table.data tr.calc td.yr { background: #EDEDEB; }

/* ================= главная: список клиентов ================= */
.home { max-width: 1180px; margin: 0 auto; padding: 22px 32px 30px; }
.hbar { display: flex; align-items: center; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--platinum); }
.hbar b { font-family: var(--serif); font-size: 19px; font-weight: 600; }
.hbar .hnote { margin-left: auto; font-family: var(--note); font-size: 11px; color: #777; }
.mark { width: 30px; height: 30px; background: var(--blue); border-radius: 10px 10px 10px 0; position: relative; }
.mark span { position: absolute; right: 5px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--lime); }
.hero { display: grid; grid-template-columns: 1.55fr 1fr; gap: 18px; margin: 24px 0 34px; }
.hblue { background: var(--blue); color: #fff; border-radius: 34px 34px 34px 0; padding: 40px 44px 38px; position: relative; overflow: hidden; }
.hblue::after { content: ""; position: absolute; right: -46px; bottom: -46px; width: 170px; height: 170px; border-radius: 50%; border: 22px solid rgba(255,255,255,.10); }
.hblue h1 { font-size: 36px; line-height: 1.12; max-width: 15ch; color: #fff; }
.hblue p { font-family: var(--note); font-size: 12.5px; line-height: 1.7; color: #DCE4FF; max-width: 54ch; margin: 16px 0 26px; }
.hbtn { display: flex; gap: 10px; flex-wrap: wrap; position: relative; z-index: 1; }
.btn.lime { background: var(--lime); border-color: var(--lime); color: #fff; font-weight: 600; padding: 10px 22px; }
.btn.lime:hover { background: #00A300; border-color: #00A300; }
.btn.wline { background: transparent; border-color: rgba(255,255,255,.7); color: #fff; padding: 10px 22px; }
.btn.wline:hover { background: rgba(255,255,255,.12); border-color: #fff; }
.hside { display: grid; grid-template-rows: auto 1fr; gap: 18px; }
.hgraph { background: var(--graphite); color: #fff; border-radius: 34px 34px 34px 0; padding: 26px 30px; }
.hgraph .k { font-family: var(--serif); font-size: 52px; font-weight: 600; line-height: 1; display: block; }
.hgraph .l { font-family: var(--note); font-size: 11.5px; color: #BDBDBD; }
.hsplit { display: flex; gap: 18px; margin-top: 18px; padding-top: 14px; border-top: 1px solid #444; font-size: 13px; color: #D0D0D0; }
.hsplit b { color: var(--lime); font-size: 16px; margin-right: 4px; }
.hplat { background: var(--platinum); border-radius: 34px 34px 34px 0; padding: 22px 30px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.hplat b { font-family: var(--serif); font-size: 17px; font-weight: 600; }
.hplat span { font-family: var(--note); font-size: 11.5px; color: #555; margin-bottom: 8px; }
.clist .chead { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.clist .chead h2 { font-size: 22px; margin-right: auto; }
.clist .search { max-width: 320px; background: #fff; border-color: var(--platinum); color: var(--ink); border-radius: 999px; padding: 8px 16px; }
.crows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--platinum); }
.crow { display: grid; grid-template-columns: minmax(260px, 1.6fr) minmax(260px, 1.4fr) 120px auto; gap: 18px; align-items: center; padding: 16px 6px 16px 18px; border-bottom: 1px solid var(--platinum); position: relative; }
.crow::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 4px; border-radius: 4px; background: var(--platinum); transition: background .15s; }
.crow:hover::before { background: var(--lime); }
.cmain b { font-size: 15.5px; font-weight: 600; }
.cmain .cmeta { display: block; font-family: var(--note); font-size: 11px; color: #777; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46ch; }
.tag { font-family: var(--note); font-size: 10px; background: var(--lime-soft); color: var(--lime-ink); padding: 1px 7px; border-radius: 8px; vertical-align: 2px; }
.cfacts { display: flex; gap: 22px; font-size: 13.5px; }
.cfacts i { display: block; font-style: normal; font-family: var(--note); font-size: 10.5px; color: #888; margin-bottom: 2px; }
.cact { display: flex; gap: 2px; justify-content: flex-end; }
.hfoot { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--platinum); font-family: var(--note); font-size: 11px; color: #888; }
@media (max-width: 960px) {
  .hero { grid-template-columns: 1fr; } .hblue { padding: 30px 26px; } .hblue h1 { font-size: 28px; }
  .crow { grid-template-columns: 1fr; gap: 8px; } .cact { justify-content: flex-start; } .home { padding: 16px; }
  .hbar .hnote { display: none; }
}
.hblue h1 { max-width: 22ch; font-size: 34px; }
.hblue { padding: 36px 42px 34px; }
.hside { grid-template-rows: auto auto; align-content: start; }
.hplat { padding: 22px 30px 24px; }

table.data.sumt th.lab, table.data.sumt td.lab { min-width: 110px; }

  const per = C.periods[perIdx(pid)];
  for (const r of report) C.log.unshift({ t: new Date().toISOString(), comp: compName(k), per: per?.label, ...r });

  touch();

}

/* ---------------------------------------------------------------- прогноз ДДС: база и стресс (та же логика, что в Excel-шаблоне / refmodel) */
const SCH = { "Дифференцированный": 1, "Аннуитет": 2, "В конце срока": 3 };
function fcParams() {
  if (!C.fc) C.fc = JSON.parse(JSON.stringify(S.fc_default));
  if (C.fc.req.amt === null || C.fc.req.amt === undefined) C.fc.req.amt = isNum(C.card.amount) ? C.card.amount : 0;
  return C.fc;
}
function amort(V, rate, remx, grace, code, payIn, drawMonth, H = 24) {
  const i = rate / 12, n = Math.max(1, remx - grace);
  const A = i === 0 ? V / n : V * i / (1 - Math.pow(1 + i, -n));
  const I = new Array(H + 1).fill(0), P = new Array(H + 1).fill(0);
  let B = drawMonth ? 0 : V;
  for (let t = 1; t <= H; t++) {
    const k = drawMonth ? t - drawMonth : t, op = B, it = op * i;
    let p;
    if (op <= 0.001) p = 0;
    else if (k >= remx) p = op;
    else if (k <= grace) p = 0;
    else if (code === 3) p = 0;
    else if (code === 2) p = Math.min(op, Math.max(0, A - it));
    else p = Math.min(op, payIn > 0 ? payIn : V / n);
    I[t] += it; P[t] += p;
    B = op - p + (drawMonth && t === drawMonth ? V : 0);
  }
  return [I, P];
}
function existingLoans(obj) {
  const f = fcParams();
  if (f.loans && f.loans.length) return f.loans;
  const L = lastPid(), d = ratio(obj, "debt", L);
  return isNum(d) && d > 0 ? [{ name: "Долг по балансу (агрегат)", bal: d, rate: f.aggRate, rem: f.aggTerm, scheme: "Дифференцированный", grace: 0, agg: true }] : [];
}
// горизонт: по сроку запрашиваемого кредита (месяц выдачи + срок), от 24 до 84 мес., кратно году; можно задать вручную
function fcHorizon() {
  const f = fcParams();
  if (N(f.horizon) >= 24) return Math.min(84, N(f.horizon));
  const end = N(f.req.amt) > 0 ? Math.max(1, N(f.req.month)) + Math.max(1, N(f.req.term)) - 1 : 24;
  return Math.max(24, Math.min(84, Math.ceil(end / 12) * 12));
}
function forecast(obj, s, Hset) {
  const f = fcParams(), L = lastPid(), H = Hset || fcHorizon();
  if (!L) return { err: "нет периодов" };
  const g = k => val(obj, k, L), A = annual(L);
  const need = ["rev", "cogs", "selling", "admin", "da", "cash", "stinv", "ar", "inv", "ap"];
  const miss = need.filter(k => !isNum(g(k)));
  if (miss.length) return { err: "не хватает данных последнего периода: " + miss.map(k => LINE[k].label).join(", ") };
  if (!(g("rev") > 0) || !(g("cogs") > 0)) return { err: "выручка и себестоимость последнего периода должны быть больше нуля" };
  const P = {}; for (const [k, v] of Object.entries(f.scen)) P[k] = N(v[s]);
  const rev0 = g("rev") * A, cogs0 = g("cogs") * A, opex0 = (g("selling") + g("admin")) * A, da0 = g("da") * A;
  const gmH = (rev0 - cogs0) / rev0, gm = gmH + P.gm_adj;
  const dso = g("ar") / rev0 * 365 + P.dso_adj, dio = g("inv") / cogs0 * 365 + P.dio_adj, dpo = g("ap") / cogs0 * 365 + P.dpo_adj;
  const seas = f.seas.map(Number), sseas = seas.reduce((a, b) => a + b, 0) || 12;
  const lastMonth = parseInt((C.periods[perIdx(L)].date || "").slice(5, 7), 10) || 12;
  const cal = t => ((((lastMonth - 1 + t) % 12) + 12) % 12) + 1;
  const I = new Array(H + 1).fill(0), PR = new Array(H + 1).fill(0);
  for (const ln of existingLoans(obj)) {
    if (!(N(ln.bal) > 0)) continue;
    const [it, pr] = amort(N(ln.bal), N(ln.rate) + P.rshock, Math.max(1, N(ln.rem) || 1), N(ln.grace), SCH[ln.scheme] || 1, null, null, H);

  const icapex = t => f.projects.reduce((a, p) => a + (t >= N(p.start) && t < N(p.start) + N(p.dur) ? N(p.amt) / Math.max(1, N(p.dur)) : 0), 0) * (1 + P.overrun);

    const cfo = ebitda - cit - dn, mc = rev * P.capex_pct, cfads = cfo - mc, ds = I[t] + PR[t], ic = icapex(t);
    const cfPre = cfads - ds - ic; cashPre += cfPre;
    const draw = t === N(R.month) ? N(R.amt) : 0;
    cashPost = cashPost + cfPre + draw - nP[t] - nI[t]; nbal = nbal + draw - nP[t];
    const dsAll = ds + nP[t] + nI[t];
    rows.push({ t, cal: cal(t), rev, ebitda, cit, dn, cfo, mc, cfads, ds, ic, cfPre, cashPre, draw, nprin: nP[t], nint: nI[t], cashPost, nbal, dsAll,
      dscr: ds > 0 ? cfads / ds : null, dscrAll: dsAll > 0 ? cfads / dsAll : null, nwc });
    nwcPrev = nwc;
  }
  const sum = k => rows.reduce((a, r) => a + r[k], 0), y1 = rows.slice(0, 12);
  const o = { rows };
  o.rev_total = sum("rev"); o.ebitda_total = sum("ebitda"); o.ebitda_y1 = y1.reduce((a, r) => a + r.ebitda, 0); o.cfads_total = sum("cfads"); o.ds_total = sum("ds"); o.ds_all_total = sum("dsAll");
  o.dscr_h_pre = o.ds_total > 0 ? o.cfads_total / o.ds_total : null;

  const y1ds = y1.reduce((a, r) => a + r.dsAll, 0); o.dscr_y1_post = y1ds > 0 ? y1.reduce((a, r) => a + r.cfads, 0) / y1ds : null;
  o.mincash_pre = Math.min(...rows.map(r => r.cashPre)); o.mincash_post = Math.min(...rows.map(r => r.cashPost));
  o.gap_max = Math.max(...rows.map(r => Math.max(0, P.buffer - r.cashPre)));

}

  for (let k = 1; k <= nComp(); k++) for (const p of C.periods) {
    for (const c of taxChecks(k, p)) {
      if (c.id === "bank_rev" && c.full) netRows.push(`${compName(k)}, ${p.label}: кредитовые обороты ${fmt(c.bk.gross)}, исключено ${fmt(c.bk.gross - c.bk.v)}, чистые кредитовые обороты ${fmt(c.b)} тыс. тг (${pctFmt(c.rel)} выручки с НДС)`);
      if (c.st === "chk" || c.st === "risk") items.push(`${compName(k)}, ${p.label}: ${c.title.toLowerCase()} — ${c.share ? `чистые кредитовые обороты составили ${pctFmt(c.rel)} выручки с НДС` : `${c.aLab.toLowerCase()} ${fmt(c.a)}, ${c.bLab.toLowerCase()} ${fmt(c.b)}, разница ${fmt(c.diff)} тыс. тг (${pctFmt(c.rel)})`}`);
    }
  }
  return `<h2 style="margin-top:14px">Налоги и банковские обороты</h2>` + (netRows.length ? `<ul>${netRows.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "") + (items.length ? `<p>Расхождения:</p><ul>${items.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p>Существенных расхождений с декларациями и банковскими оборотами не выявлено (по загруженным документам).</p>`);
}

/* ---------- загрузка документов */
function compByBin(bin) {
  if (!bin) return 0;
  const i = C.companies.findIndex(x => String(x.bin || "").replace(/\D/g, "") === bin);
  if (i >= 0) return i + 1;
  return String(C.card.bin || "").replace(/\D/g, "") === bin ? 1 : 0;
}
async function readDoc(file) {
  if (/\.pdf$/i.test(file.name)) {
    const r = await DocParse.read(await file.arrayBuffer());
    if (r.pdf.noText) throw new Error("в PDF нет текста — это скан или картинка. Введите суммы вручную");
    return r;
  }
  if (/\.(xlsx|xlsm)$/i.test(file.name)) return DocParse.readSheets(await readWorkbook(await file.arrayBuffer()));
  if (/\.csv$/i.test(file.name)) return DocParse.readSheets(csvSheets(await file.arrayBuffer()));
  if (/\.xls$/i.test(file.name)) throw new Error("старый формат .xls не читается — откройте файл в Excel и сохраните как .xlsx");
  throw new Error("поддерживаются PDF, Excel (.xlsx, .xlsm) и CSV");
}
async function importDocs(files, kDef, mode) {
  ensureDocs();
  const rep = [];
  for (const file of files) {
    let r;
    try { toast("Читаю " + file.name + "…"); r = await readDoc(file); }
    catch (e) { rep.push({ file: file.name, err: /паролем/.test(e.message) ? e.message + " — снимите пароль или введите суммы вручную" : e.message }); continue; }
    let kind = r.kind;
    if (!kind) {
      kind = await dialog("Что это за документ?", `<p>Не удалось уверенно определить тип документа <b>${esc(file.name)}</b>.</p>`, [{ t: "Пропустить", v: null }, { t: "Справка об оборотах", v: "bank" }, { t: "Выписка по счёту", v: "stmt" }, { t: "Декларация", primary: mode === "tax", v: "decl" }]);
      if (!kind) { rep.push({ file: file.name, err: "пропущено" }); continue; }
      if (kind === "decl") r.decl = DocParse.parseDecl(r.pdf); else if (kind === "stmt") r.stmt = DocParse.parseStmt(r.pdf); else r.bank = DocParse.parseBank(r.pdf);
    }
    if (kind === "decl") {
      const d = r.decl, keys = DocParse.pickKeys(d, DMAP), vals = {};
      for (const [key, code] of Object.entries(keys)) { const l = d.lines.find(x => x.code === code); if (l && l.vals.length) vals[key] = l.vals[0]; }
      const doc = { id: uid(), k: compByBin(d.bin) || kDef, file: file.name, form: d.form, formName: d.formName, year: d.year, part: d.part, bin: d.bin, lines: d.lines, vals, src: keys, t: Date.now() };
      const saved = await declEditor(doc, true, d.bin && compByBin(d.bin) ? "Компания определена по БИН " + d.bin : "");
      rep.push(saved ? { file: file.name, page: "tax", ok: `${saved.formName}, ${saved.year}, ${PARTS[saved.part]}: строк ${d.lines.length}` } : { file: file.name, err: "не сохранено" });
    } else if (kind === "stmt") {
      const s = r.stmt;
      if (!s.txs.length) { rep.push({ file: file.name, err: "в выписке не найдено операций (нужны колонки «Дата», «Дебет»/«Кредит» или «Сумма»)" }); continue; }
      const doc = { id: uid(), kind: "stmt", k: compByBin(s.bin) || kDef, file: file.name, bank: s.bank, acc: s.acc, cur: s.cur || "KZT", from: s.from, to: s.to, txs: s.txs, ov: {}, t: Date.now() };
      const saved = await stmtEditor(doc, true, s.bin && compByBin(s.bin) ? "Компания определена по БИН " + s.bin : "");
      rep.push(saved ? { file: file.name, page: "bank", ok: `выписка ${saved.acc || ""}: операций ${s.txs.length}` } : { file: file.name, err: "не сохранено" });
    } else {
      const b = r.bank;
      if (!b.accounts.length) { rep.push({ file: file.name, err: "не найдена таблица оборотов (месяцы и колонки дебет/кредит). Введите обороты вручную" }); continue; }
      let n = 0;
      for (let i = 0; i < b.accounts.length; i++) {
        const a = b.accounts[i];
        const doc = { id: uid(), kind: "turn", k: compByBin(b.bin) || kDef, file: file.name, bank: b.bank, acc: a.acc, cur: a.cur || "KZT", rate: null, months: a.months, total: a.total, rangeOnly: !!a.rangeOnly, from: b.period?.from || "", to: b.period?.to || "", t: Date.now() };
        if (await bankEditor(doc, true, b.accounts.length > 1 ? `Счёт ${i + 1} из ${b.accounts.length}` : "")) n++;
      }
      rep.push(n ? { file: file.name, page: "bank", ok: `справка ${b.bank || ""}: счетов ${n}` } : { file: file.name, err: "не сохранено" });
    }
  }
  for (const x of rep) C.log.unshift({ t: new Date().toISOString(), file: x.file, comp: "", per: "", kind: "PDF", note: x.ok || "", err: x.err || "" });
  C.log = C.log.slice(0, 200);
  touch();
  return rep;
}

/* ---------- выписка: просмотр операций и классификация */
function stmtRowsHTML(doc, own, filter, q) {
  const rows = [];
  (doc.txs || []).forEach((t, i) => {
    if (!t.cr) return;
    const [c, why] = txCat(doc, i, t, own);
    if (filter === "ex" && !c) return; if (filter === "inc" && c) return;
    if (q && !low2(`${t.cp} ${t.purp} ${t.knp} ${t.bin}`).includes(q)) return;
    rows.push(`<tr class="${c ? "ex" : ""}"><td class="lab">${esc(t.d.split("-").reverse().join("."))}</td><td style="text-align:left;white-space:normal">${esc(t.cp || "—")}${t.bin ? `<span class="formula">БИН ${esc(t.bin)}</span>` : ""}</td>
      <td style="text-align:left;white-space:normal">${esc(t.purp || t.op || "—")}${t.knp ? `<span class="formula">КНП ${esc(t.knp)}</span>` : ""}</td><td>${m2(t.cr)}${(t.cur || doc.cur) !== "KZT" ? ` ${esc(t.cur || doc.cur)}` : ""}</td>
      <td><select class="inp" data-txcat="${i}"><option value="inc"${!c ? " selected" : ""}>В расчёте</option>${Object.entries(DocParse.CATS).map(([k2, t2]) => `<option value="${k2}"${c === k2 ? " selected" : ""} title="${esc(t2)}">Исключить: ${esc(CAT_SHORT[k2])}</option>`).join("")}</select>${why ? `<span class="formula">${esc(why)}</span>` : ""}</td></tr>`);
  });
  return rows.length ? rows.slice(0, 1500).join("") + (rows.length > 1500 ? `<tr><td colspan="5" class="muted">Показаны первые 1500 операций — уточните поиск.</td></tr>` : "") : `<tr><td colspan="5" class="muted">Нет операций</td></tr>`;
}
const low2 = s => String(s || "").toLowerCase().replace(/ё/g, "е");
function stmtSummary(doc, own) {
  let cr = 0, db = 0, ex = 0, n = 0; const by = {};
  (doc.txs || []).forEach((t, i) => { db += t.db; if (!t.cr) return; n++; cr += t.cr; const [c] = txCat(doc, i, t, own); if (c) { ex += t.cr; by[c] = (by[c] || 0) + t.cr; } });
  return `<table class="data sumt"><thead><tr><th class="lab">Поступлений</th><th>Кредит всего, ${esc(doc.cur)}</th><th>Исключено</th><th>Чистые кредитовые обороты</th><th>Дебет всего</th></tr></thead><tbody><tr><td class="lab">${n}</td><td>${m2(cr)}</td><td>${m2(ex)}</td><td class="strong">${m2(cr - ex)}</td><td>${m2(db)}</td></tr></tbody></table>
    <p class="small muted" style="margin:4px 0 0">${Object.entries(by).map(([c, v]) => `${CAT_SHORT[c]}: ${m2(v)}`).join(" · ") || "Исключений нет"}</p>`;
}

/* ---------- ОКЭД на карточке */
function okedHint(code) {
  const d = okedDigits(code); if (!d) return "";
  const r = okedLookup(d);
  if (!r) return "код не найден";
  if (r.divOnly && d.length > 2) return "показано название раздела " + d.slice(0, 2) + " — для точного названия загрузите справочник ОКЭД";
  return r.exact ? "по справочнику" : "по справочнику (ближайший уровень " + okedFmt(d.slice(0, r.level)) + ")";
}
function okedPanel() {
  if (!C.card.oked || !C.card.oked.length) C.card.oked = [{ code: "", name: "" }];
  const n = Object.keys(OKED).length;
  const rows = C.card.oked.map((o, i) => {
    const nm = o.manual ? o.name : (okedLookup(o.code)?.name || o.name || "");
    return `<tr><td class="lab">${i === 0 ? "Основной" : "Доп. " + i}</td>
      <td><input class="inp" data-oked="${i}" data-f="code" value="${esc(o.code)}" placeholder="например, 46.90.0" inputmode="numeric" style="max-width:150px"></td>
      <td><input class="inp" data-oked="${i}" data-f="name" value="${esc(nm)}" placeholder="наименование подставится по коду"><span class="small muted" data-okedhint="${i}">${esc(okedHint(o.code))}</span></td>
      <td>${C.card.oked.length > 1 ? `<button class="btn ghost danger" data-deloked="${i}">Удалить</button>` : ""}</td></tr>`;
  }).join("");
  return `<section class="panel"><h2>Виды деятельности (ОКЭД)</h2><p class="hint">До ${MAX_OKED} кодов на клиента; первый — основной. Наименование подставляется по коду, его можно поправить вручную. ${n ? `Справочник ОКЭД загружен: ${nf0.format(n)} кодов.` : "Сейчас встроены только разделы (первые 2 цифры). Чтобы подтягивались точные наименования, один раз загрузите справочник ОКЭД на странице «Настройка загрузки»."}</p>
    <div class="tablewrap" style="max-height:none"><table class="data form oked"><thead><tr><th class="lab">Вид</th><th style="text-align:left">Код ОКЭД</th><th style="text-align:left">Наименование</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    ${C.card.oked.length < MAX_OKED ? `<p style="margin-top:10px"><button class="btn" data-act="addoked">Добавить код ОКЭД</button></p>` : ""}</section>`;
}

/* ---------- отчётность компании */
function linesTable(obj, blocks, editable) {
  const pers = C.periods;
  let h = `<div class="tablewrap"><table class="data"><thead><tr><th class="lab">Показатель, тыс. тг</th>${pers.map(p => `<th>${esc(p.label)}<span class="pertitle">${esc(p.basis === "Годовой" ? "год" : p.basis.toLowerCase())}${p.months !== 12 ? ", " + p.months + " мес." : ""}</span></th>`).join("")}</tr></thead><tbody>`;
  for (const b of blocks) for (const [typ, key, label] of LINES[b]) {
    if (!key) { h += `<tr class="sec"><td class="lab" colspan="${pers.length + 1}">${esc(label)}</td></tr>`; continue; }
    const code = "";
    const sub = /^в т\.ч\./.test(label) || (CF_CODE[key] && typ === "opt" && !["cf120", "cf140", "cf150r"].includes(key)) ? " sub" : "";
    h += `<tr class="${typ === "calc" ? "calc" : ""}${sub}"><td class="lab">${code}${esc(label)}${typ === "opt" && !CF_CODE[key] ? ' <span class="small muted">(необяз.)</span>' : ""}</td>`;
    for (const p of pers) {
      if (typ !== "calc" && editable) {
        const v = rawComp(obj, key, p.id), src = C.src?.[obj]?.[key]?.[p.id];
        h += `<td class="cell${typ === "opt" ? " opt" : ""}"><input data-k="${obj}" data-key="${key}" data-pid="${p.id}" value="${esc(fmt(v))}" class="${src ? "imp" : ""}" ${src ? `data-src="${esc("Загружено: " + src.form + ", " + src.file + " — " + src.status)}"` : ""} aria-label="${esc(label + ", " + p.label)}"></td>`;
      } else {
        const v = val(obj, key, p.id);
        h += `<td class="${isNum(v) && v < 0 ? "neg" : ""}" data-v="${obj}|${key}|${p.id}">${fmt(v)}</td>`;
      }
    }
    h += "</tr>";
  }
  return h + "</tbody></table></div>";
}

function cashChart(b, s) {

}

    <label class="f" style="margin-top:12px"><span>Условия / ковенанты</span><textarea class="inp" data-concl="conditions" style="min-height:70px">${esc(C.concl.conditions)}</textarea></label></section>
  <section class="panel" id="conclDoc">${conclusionHTML(false)}</section>`;
}

/* ---------- настройка загрузки и журнал */
function pageMap() {
  const st = C.settings;
  const rows = S.mapping.map(m => `<tr><td class="lab">${esc({ B: "Баланс", P: "ОПиУ", C: "ОДДС" }[m[0]])}: ${esc(LINE[m[1]]?.label || m[1])}</td><td style="text-align:left">${esc(m[2] || "—")}</td><td style="text-align:left">${esc(m[3] || "—")}</td>
    <td class="cell opt"><input data-custom="${m[1]}" value="${esc(C.custom?.[m[1]] || "")}" style="text-align:left" placeholder="коды через запятую"></td></tr>`).join("");
  return `<div class="pagehead"><div class="lead"><h1>Настройка загрузки форм</h1><p>Какая строка формы попадает в какую строку анализатора. Полная форма и форма МСБ распознаются автоматически. Для нестандартной формы заполните колонку «Свой вариант» и выберите её ниже.</p></div></div>
  <section class="panel"><div class="grid2">
    <label class="f"><span>Единицы в файлах форм</span><select class="inp" data-set="units">${[["auto", "Определять автоматически и переводить в тыс. тг"], ["ask", "Спрашивать при каждой загрузке"], ["t", "Всегда тенге"], ["k", "Всегда тыс. тенге"], ["m", "Всегда млн тенге"]].map(([v, t]) => `<option value="${v}"${st.units === v ? " selected" : ""}>${t}</option>`).join("")}</select></label>
    <label class="f"><span>Вариант формы</span><select class="inp" data-set="variant">${[[0, "Определять автоматически"], [1, "Полная форма (приказ №404)"], [2, "Форма МСБ"], [3, "Свой вариант"]].map(([v, t]) => `<option value="${v}"${(st.variant || 0) == v ? " selected" : ""}>${t}</option>`).join("")}</select></label>
    <label class="f"><span>Предыдущий период из второй колонки формы</span><select class="inp" data-set="prev"><option value="0"${!st.prev ? " selected" : ""}>Не загружать</option><option value="1"${st.prev ? " selected" : ""}>Загружать, если ячейки пусты</option></select></label></div>
    <p class="hint" style="margin-top:12px">Анализатор считает в тыс. тг. При автоматическом режиме единицы файла определяются по масштабу других периодов компании или по величине чисел, и значения сразу приводятся к тыс. тг; в журнале видно, что было сделано.</p>
    <p class="hint">Синтаксис кодов: 010 — как в форме; *011 — по модулю; -025 — вычесть по модулю; !200 — вычесть со знаком; #текст — строка «в том числе» без кода, название которой содержит текст. Коды 010 и 10 — одно и то же.</p></section>
  <section class="panel"><h2>Справочник ОКЭД</h2><p class="hint">${Object.keys(OKED).length ? `Загружен: ${nf0.format(Object.keys(OKED).length)} кодов. Хранится в этом браузере и действует для всех клиентов.` : "Не загружен — по коду подставляется только название раздела (2 знака)."} Загрузите классификатор ОКЭД в Excel (.xlsx), например с сайта Бюро национальной статистики: колонки кода и наименования найдутся сами.</p>
    <button class="btn" data-act="okedfile">${Object.keys(OKED).length ? "Обновить справочник ОКЭД" : "Загрузить справочник ОКЭД"}</button></section>
  <div class="tablewrap"><table class="data"><thead><tr><th class="lab">Строка анализатора</th><th style="text-align:left">Полная форма</th><th style="text-align:left">Форма МСБ</th><th style="text-align:left">Свой вариант</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function pageLog() {
  const rows = C.log.map(r => `<tr><td class="lab" style="min-width:150px">${new Date(r.t).toLocaleString("ru-RU")}</td><td style="text-align:left">${esc(r.file)}${r.sheet ? " / " + esc(r.sheet) : ""}</td><td style="text-align:left">${esc([r.comp, r.per].filter(Boolean).join(", "))}</td>
    <td style="text-align:left;white-space:normal">${r.err ? stChip("crit", "ошибка") + " " + esc(r.err) : r.kind === "PDF" ? stChip("ok", "PDF") + " " + esc(r.note || "") : `${stChip("ok", SRC_TXT[r.kind])} ${r.n} строк; ${esc(r.prof)}; ${esc(r.units)}${r.over ? "; перезаписано " + r.over : ""}${r.miss?.length ? "; нет кодов: " + esc(r.miss.join(", ")) : ""}`}</td></tr>`).join("");

  ${rows ? `<div class="tablewrap"><table class="data"><thead><tr><th class="lab">Когда</th><th style="text-align:left">Файл</th><th style="text-align:left">Куда</th><th style="text-align:left">Результат</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="empty"><h2>Загрузок пока не было</h2><p class="muted">Формы загружаются на странице «Отчётность».</p></div>`}`;
}
const PAGES = { card: pageCard, bal: () => pageForm("bal"), odr: () => pageForm("odr"), cf: () => pageForm("cf"), tax: pageTax, bank: pageBank, cons: pageCons, an: pageAn, prob: pageProb, concl: pageConcl, map: pageMap, log: pageLog };

/* ---------- диалоги */
function dialog(title, body, buttons) {
  return new Promise(res => {
    const d = $("#dlg"); $("#dlgT").textContent = title; $("#dlgB").innerHTML = body;
    $("#dlgF").innerHTML = buttons.map((b, i) => `<button class="btn ${b.primary ? "primary" : ""}" data-i="${i}">${esc(b.t)}</button>`).join("");
    $("#dlgF").onclick = e => { const i = e.target.dataset.i; if (i === undefined) return; const v = buttons[+i].v; const out = typeof v === "function" ? v(d) : v; d.close(); res(out); };
    d.onclose = () => { if (!d.open) res(undefined); };   // событие закрытия предыдущего окна приходит позже — его пропускаем
    d.showModal();
  });
}
async function askUnits(fname, mx, guess) {
  const body = `<p>Анализатор считает в тыс. тенге. В шапке форм часто написано «тысяч тенге», а цифры на самом деле в тенге.</p>
    <p>Наибольшее число в файле <b>${esc(fname)}</b>: <b>${fmt(mx)}</b>.</p>
    <div class="chips" role="radiogroup">${[["t", "тенге — разделить на 1000"], ["k", "тыс. тенге — как есть"], ["m", "млн тенге — умножить на 1000"]].map(([v, t]) => `<label class="btn"><input type="radio" name="u" value="${v}" ${v === guess ? "checked" : ""}> ${t}</label>`).join("")}</div>`;
  const v = await dialog("В каких единицах цифры?", body, [{ t: "Отменить", v: null }, { t: "Загрузить", primary: true, v: d => d.querySelector("input[name=u]:checked")?.value }]);
  return v ? { t: 0.001, k: 1, m: 1000 }[v] : 0;
}
async function importDialog() {
  const persOpts = C.periods.map((p, i) => `<option value="${p.id}"${i === C.periods.length - 1 ? " selected" : ""}>${esc(p.label)}</option>`).join("");
  const compsOpts = C.companies.map((x, i) => `<option value="${i + 1}"${COMP_TAB === i + 1 ? " selected" : ""}>К${i + 1} · ${esc(x.name || "без названия")}</option>`).join("");
  const body = `<p class="muted">Баланс, ОПиУ и ОДДС в Excel (.xlsx, .xlsm) — можно сразу несколько файлов одной компании за один период. Файлы читаются здесь же, в браузере, и никуда не отправляются.</p>
    <div class="grid2" style="margin:12px 0"><label class="f"><span>Компания</span><select class="inp" id="iComp">${compsOpts}</select></label><label class="f"><span>Период</span><select class="inp" id="iPer">${persOpts}</select></label></div>
    <p class="small muted" style="margin-top:6px">PDF деклараций, выписок и справок банков тоже можно перетащить сюда — они попадут на страницы «Налоги» и «Банк».</p>
    <label class="drop" id="iDrop"><input type="file" id="iFiles" multiple accept=".xlsx,.xlsm,.pdf" style="display:none"><span id="iTxt">Перетащите файлы сюда или нажмите, чтобы выбрать</span></label>`;
  let files = [];
  setTimeout(() => {
    const inp = $("#iFiles"), drop = $("#iDrop"), set = fl => { files = Array.from(fl); $("#iTxt").textContent = files.map(f => f.name).join(", ") || "Файлы не выбраны"; };
    inp.onchange = () => set(inp.files);
    drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); set(e.dataTransfer.files); };
  });
  const sel = await dialog("Загрузить формы отчётности", body, [{ t: "Отменить", v: null }, { t: "Загрузить", primary: true, v: () => ({ k: +$("#iComp").value, pid: $("#iPer").value }) }]);
  if (!sel || !files.length) { if (sel) toast("Файлы не выбраны"); return; }
  const pdfs = files.filter(f => /\.pdf$/i.test(f.name)); files = files.filter(f => !/\.pdf$/i.test(f.name));
  if (pdfs.length && !files.length) return runDocImport(pdfs, sel.k);
  const rep = await importFiles(files, sel.k, sel.pid, askUnits);
  if (pdfs.length) { await importDocs(pdfs, sel.k); toast("PDF загружены — см. страницы «Налоги» и «Банк»"); }
  COMP_TAB = sel.k; if (!["bal", "odr", "cf"].includes(PAGE)) PAGE = "bal"; render();
  const lines = rep.map(r => `<div class="logline"><b>${esc(r.file)}</b>${r.sheet ? " / " + esc(r.sheet) : ""}: ${r.err ? stChip("crit", "не загружено") + " " + esc(r.err) : `${stChip("ok", SRC_TXT[r.kind])} ${r.n} строк, ${esc(r.prof)}, ${esc(r.units)}${r.over ? `, перезаписано ${r.over}` : ""}${r.miss.length ? `<br><span class="small muted">В файле нет кодов: ${esc(r.miss.join(", "))}</span>` : ""}`}</div>`).join("");
  await dialog("Результат загрузки", lines + `<p class="small muted" style="margin-top:10px">Загруженные значения отмечены полосой слева; проверьте их и страницу «Сверки».</p>`, [{ t: "Готово", primary: true, v: true }]);
}

/* ---------- события */
document.addEventListener("click", async e => {
  const t = e.target.closest("button, [data-act]"); if (!t) return;
  const d = t.dataset;
  if (d.page) { PAGE = d.page; render(); window.scrollTo(0, 0); return; }
  if (d.ctab) { COMP_TAB = +d.ctab; render(); return; }
  if (d.antab) { AN_TAB = d.antab; render(); return; }
  if (d.fctab !== undefined) { FC_TAB = +d.fctab; $("#fcOut").innerHTML = fcOutHTML(); return; }
  if (d.delloan !== undefined) { fcParams().loans.splice(+d.delloan, 1); touch(); render(); return; }
  if (d.deloked !== undefined) { C.card.oked.splice(+d.deloked, 1); touch(); render(); return; }
  if (d.delproj !== undefined) { fcParams().projects.splice(+d.delproj, 1); touch(); render(); return; }
  if (d.open) { C = CLIENTS.find(c => c.id === d.open); ensureDocs(C); CACHE.clear(); PAGE = "card"; render(); return; }
  if (d.exp) { const c = CLIENTS.find(c => c.id === d.exp); download(fileName(c), JSON.stringify(c, null, 1), "application/json"); return; }
  if (d.del) { const c = CLIENTS.find(c => c.id === d.del); if (await dialog("Удалить клиента?", `<p>«${esc(c.card.name)}» будет удалён из этого браузера. Если нужна копия — сначала сохраните файл клиента.</p>`, [{ t: "Отменить", v: false }, { t: "Удалить", primary: true, v: true }])) { CLIENTS = CLIENTS.filter(x => x !== c); saveAll(true); render(); } return; }
  if (d.delcomp !== undefined) { const i = +d.delcomp; C.companies.splice(i, 1); const nd = {}; Object.keys(C.data).forEach(k => { const n = +k; if (n < i + 1) nd[n] = C.data[k]; else if (n > i + 1) nd[n - 1] = C.data[k]; }); C.data = nd; if (C.obj > nComp()) C.obj = 0; touch(); render(); return; }
  if (d.delper !== undefined) { C.periods.splice(+d.delper, 1); touch(); render(); return; }
  switch (d.act) {
    case "clients": C = null; render(); break;
    case "new": { const c = newClient(); CLIENTS.push(c); C = c; PAGE = "card"; saveAll(true); render(); break; }
    case "demo": { const c = demoClient(); CLIENTS.push(c); C = c; PAGE = "an"; saveAll(true); render(); break; }
    case "export": download(fileName(C), JSON.stringify(C, null, 1), "application/json"); toast("Файл клиента сохранён в «Загрузки»"); break;
    case "import": { const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json"; inp.onchange = async () => { try { const c = JSON.parse(await inp.files[0].text()); if (!c.card || !c.periods) throw new Error("это не файл клиента"); const ex = CLIENTS.findIndex(x => x.id === c.id); if (ex >= 0) CLIENTS[ex] = c; else CLIENTS.push(c); saveAll(true); C = c; ensureDocs(C); CACHE.clear(); render(); toast("Клиент открыт из файла"); } catch (err) { toast("Не удалось открыть: " + err.message); } }; inp.click(); break; }
    case "addcomp": C.companies.push({ name: "", bin: "", role: S.lists.role[0], form: S.lists.form[0], vat: "Да", regime: S.lists.regime[0] }); touch(); render(); break;
    case "addper": { const l = C.periods[C.periods.length - 1], y = parseInt(l?.date?.slice(0, 4) || new Date().getFullYear(), 10) + 1; C.periods.push({ id: uid(), label: String(y), date: `${y}-12-31`, basis: "Годовой", months: 12 }); touch(); render(); break; }
    case "addperfirst": { const f = C.periods[0], y = parseInt(f?.date?.slice(0, 4) || new Date().getFullYear(), 10) - 1; C.periods.unshift({ id: uid(), label: String(y), date: `${y}-12-31`, basis: "Годовой", months: 12 }); touch(); render(); break; }
    case "importdlg": importDialog(); break;
    case "addoked": if (C.card.oked.length < MAX_OKED) C.card.oked.push({ code: "", name: "" }); touch(); render(); break;
    case "okedfile": { const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".xlsx,.xlsm"; inp.onchange = async () => { try { const n = await loadOkedFile(inp.files[0]); toast("Справочник ОКЭД загружен: " + nf0.format(n) + " кодов"); render(); } catch (err) { toast("Не удалось загрузить справочник: " + err.message); } }; inp.click(); break; }
    case "addloan": { const f = fcParams(); f.loans = f.loans || []; if (!f.loans.length) { const d = ratio(C.obj, "debt", lastPid()); if (isNum(d) && d > 0) f.loans.push({ name: "Долг по балансу", bal: d, rate: f.aggRate, rem: f.aggTerm, scheme: "Дифференцированный", grace: 0 }); else f.loans.push({ name: "", bal: 0, rate: 0.16, rem: 36, scheme: "Дифференцированный", grace: 0 }); } else f.loans.push({ name: "", bal: 0, rate: 0.16, rem: 36, scheme: "Дифференцированный", grace: 0 }); touch(); render(); break; }
    case "addproj": { const f = fcParams(); f.projects = f.projects || []; f.projects.push({ name: "", amt: 0, start: 3, dur: 3, own: 0.3 }); touch(); render(); break; }
    case "word": { const html = `<html><head><meta charset="utf-8"><style>body{font-family:Roboto,Calibri,Arial;font-size:11pt;color:#272727}h1,h2{font-family:'Futura PT','Century Gothic',Arial;color:#272727}h1{font-size:16pt;border-bottom:3pt solid #023DFF;padding-bottom:4pt}h2{font-size:13pt;color:#023DFF}.small,.muted{font-family:Verdana;font-size:8pt;color:#666}td,th{border:1px solid #E5E4E2;padding:3px 6px;text-align:right}</style></head><body>${conclusionHTML(true)}</body></html>`; download(`Заключение_${safeName(C.card.name)}.doc`, "﻿" + html, "application/msword"); break; }
    case "print": window.print(); break;
  }
});
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (!C) return;
  if (d.key) {
    const v = parseNum(t.value);
    if (t.value.trim() !== "" && v === null) { toast("Не число: «" + t.value + "» — значение не сохранено"); t.value = fmt(rawComp(+d.k, d.key, d.pid)); return; }
    C.data[d.k] = C.data[d.k] || {}; C.data[d.k][d.key] = C.data[d.k][d.key] || {}; C.data[d.k][d.key][d.pid] = v;
    if (C.src?.[d.k]?.[d.key]?.[d.pid]) C.src[d.k][d.key][d.pid].status = "Изменено вручную";
    t.value = fmt(v); touch(); refreshCalc(); return;
  }
  if (d.elim) { const v = parseNum(t.value); C.elim[d.elim] = C.elim[d.elim] || {}; C.elim[d.elim][d.pid] = v; t.value = fmt(v); touch(); refreshCalc(); return; }
  if (d.fc) {
    const path = d.fc.split("."), f = fcParams(); let o = f; for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
    const last = path[path.length - 1];
    if (d.numsel !== undefined) { o[last] = +t.value; touch(); render(); return; }
    if (t.tagName === "SELECT" || last === "name") o[last] = t.value;
    else { let v = parseNum(t.value); if (v === null) { toast("Не число: «" + t.value + "»"); return; } if (d.pct !== undefined) v = v / 100; o[last] = v; t.value = fmt(d.pct !== undefined ? v * 100 : v, d.pct !== undefined ? "m1" : "m"); }
    touch(); refreshCalc(); return;
  }
  if (d.elimok) { C.elimOk[d.elimok] = t.checked; touch(); refreshCalc(); return; }
  if (d.oked !== undefined) {
    const o = C.card.oked[+d.oked];
    if (d.f === "code") {
      const dg = okedDigits(t.value); o.code = dg ? okedFmt(dg) : ""; t.value = o.code; o.manual = false;
      const r = okedLookup(o.code); o.name = r ? r.name : "";
      const nm = document.querySelector(`input[data-oked="${d.oked}"][data-f="name"]`); if (nm) nm.value = o.name;
      const h = document.querySelector(`[data-okedhint="${d.oked}"]`); if (h) h.textContent = okedHint(o.code);
    } else { o.name = t.value; o.manual = true; }
    touch(); return;
  }
  if (d.card) { C.card[d.card] = d.num !== undefined ? parseNum(t.value) : t.value; touch(); if (d.card === "name") render(); return; }
  if (d.comp !== undefined) { C.companies[+d.comp][d.f] = t.value; touch(); return; }
  if (d.per !== undefined) { const p = C.periods[+d.per]; p[d.f] = d.f === "months" ? Math.max(1, Math.min(12, parseInt(t.value, 10) || 12)) : t.value; touch(); return; }
  if (d.act === "obj") { C.obj = +t.value; touch(); render(); return; }
  if (d.concl) { C.concl[d.concl] = t.value; touch(); const doc = $("#conclDoc"); if (doc) doc.innerHTML = conclusionHTML(false); return; }
  if (d.set) { C.settings[d.set] = d.set === "units" ? t.value : +t.value; touch(); return; }
  if (d.custom) { C.custom[d.custom] = t.value.trim(); touch(); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches("td.cell input")) { e.preventDefault(); const td = e.target.closest("td"), tr = td.parentElement, idx = Array.from(tr.children).indexOf(td); let n = tr.nextElementSibling; while (n && !n.children[idx]?.querySelector("input")) n = n.nextElementSibling; e.target.blur(); n?.children[idx].querySelector("input").focus(); }
});
function refreshCalc() {
  document.querySelectorAll("[data-v]").forEach(td => {
    const [o, key, pid] = td.dataset.v.split("|"); const v = val(+o, key, pid);
    td.textContent = fmt(v); td.classList.toggle("neg", isNum(v) && v < 0);
  });
  PROB = problems(); paintProblemMarks();
  const out = $("#fcOut"); if (out) out.innerHTML = fcOutHTML();
  const hz = document.querySelector('select[data-fc="horizon"] option[value="0"]'); if (hz) hz.textContent = `По сроку кредита (${fcHorizon()} мес.)`;
}
const safeName = s => String(s || "клиент").replace(/[\\/:*?"<>|«»]/g, "").trim().slice(0, 60) || "клиент";
const fileName = c => `Клиент_${safeName(c.card.name)}_${new Date().toISOString().slice(0, 10)}.json`;
window.addEventListener("beforeunload", () => saveAll(true));
render();
</script></body></html>
