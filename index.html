<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data: blob:; connect-src 'self' blob: data:">
<title>Финансовый анализ РК</title>
<style>:root {
  --paper: #F3F6F6; --surface: #FFFFFF; --ink: #17262E; --muted: #5B6B73; --rule: #D5DDE0; --rule-soft: #E7ECEE;
  --teal: #0E5A66; --teal-ink: #0A4650; --teal-soft: #E1EEF0;
  --in-bg: #FFF7D6; --in-ink: #1F4FB8; --calc-bg: #F1F4F5;
  --ok: #2F7A4B; --ok-bg: #E2F1E7; --chk: #9A5B00; --chk-bg: #FBF0D6; --risk: #B9410C; --risk-bg: #FCE6DA;
  --crit: #9B1C3A; --crit-bg: #F7DCE3; --nd: #66727A; --nd-bg: #ECEFF1;
  --serif: "Lora", Georgia, "Times New Roman", serif;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --r: 6px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 26px; line-height: 1.2; }
h2 { font-size: 19px; line-height: 1.3; }
h3 { font-size: 16px; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
a { color: var(--teal); }

/* shell */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.rail { background: var(--teal-ink); color: #DCEBEC; padding: 22px 14px 18px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.brand { font-family: var(--serif); font-size: 18px; color: #fff; line-height: 1.25; padding: 0 8px; }
.brand small { display: block; font-family: var(--sans); font-size: 12px; color: #9EC3C7; margin-top: 4px; }
.rail .client { padding: 10px 8px; border-top: 1px solid #1F6670; border-bottom: 1px solid #1F6670; }
.rail .client b { color: #fff; display: block; font-weight: 600; }
.rail .client button { background: none; border: 0; color: #9EC3C7; padding: 0; cursor: pointer; font-size: 12.5px; margin-top: 4px; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li { margin: 1px 0; }
.steps button { width: 100%; text-align: left; background: none; border: 0; color: #DCEBEC; padding: 8px 8px 8px 36px; border-radius: var(--r); cursor: pointer; position: relative; }
.steps li.num button::before { counter-increment: s; content: counter(s); position: absolute; left: 8px; top: 7px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid #4E8C93; font-size: 11.5px; display: grid; place-items: center; color: #BFD9DB; }
.steps button:hover { background: #135560; }
.steps button[aria-current="page"] { background: #F3F6F6; color: var(--teal-ink); font-weight: 600; }
.steps button[aria-current="page"]::before { border-color: var(--teal); color: var(--teal); }
.steps .dot { position: absolute; right: 8px; top: 13px; width: 8px; height: 8px; border-radius: 50%; }
.rail .foot { margin-top: auto; font-size: 12px; color: #9EC3C7; padding: 0 8px; }
.rail .foot button { display: block; background: none; border: 0; color: #DCEBEC; padding: 5px 0; cursor: pointer; text-align: left; }
.main { min-width: 0; padding: 26px 32px 60px; }
.pagehead { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.pagehead .lead { flex: 1 1 380px; }
.pagehead p { color: var(--muted); max-width: 72ch; margin-top: 6px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* controls */
.btn { border: 1px solid var(--rule); background: var(--surface); padding: 7px 13px; border-radius: var(--r); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: #AEBCC1; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.primary:hover { background: var(--teal-ink); }
.btn.ghost { background: none; border-color: transparent; color: var(--teal); }
.btn.danger { color: var(--crit); }
label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
label.f > span { color: var(--muted); }
.inp, select.inp, textarea.inp { border: 1px solid var(--rule); background: var(--in-bg); color: var(--in-ink); border-radius: 4px; padding: 6px 8px; width: 100%; }
textarea.inp { min-height: 110px; resize: vertical; line-height: 1.5; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px 16px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 18px 20px; margin-bottom: 16px; }
.panel > h2 { margin-bottom: 12px; }
.panel .hint { color: var(--muted); font-size: 12.5px; margin: -6px 0 12px; max-width: 80ch; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--teal); color: #fff; }

/* data tables */
.tablewrap { overflow: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); max-height: calc(100vh - 210px); }
table.data { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
table.data th, table.data td { padding: 5px 10px; border-bottom: 1px solid var(--rule-soft); text-align: right; white-space: nowrap; }
table.data thead th { position: sticky; top: 0; background: #E9EFF0; z-index: 2; font-weight: 600; color: var(--teal-ink); border-bottom: 1px solid var(--rule); }
table.data th.lab, table.data td.lab { text-align: left; white-space: normal; position: sticky; left: 0; background: inherit; z-index: 1; min-width: 300px; max-width: 460px; }
table.data tbody tr { background: var(--surface); }
table.data thead th.lab { z-index: 3; }
table.data tr.sec td { background: var(--teal-soft); color: var(--teal-ink); font-weight: 600; text-align: left; font-size: 12.5px; padding-top: 9px; }
table.data tr.calc { background: var(--calc-bg); }
table.data tr.calc td.lab { font-weight: 600; }
table.data tr.sub td.lab { padding-left: 26px; color: #34464F; }
table.data td.cell { padding: 0; }
table.data td.cell input { width: 100%; min-width: 108px; border: 0; background: var(--in-bg); color: var(--in-ink); text-align: right; padding: 5px 10px; border-left: 1px solid #F4E7B0; }
table.data td.cell input:focus { background: #fff; outline: 2px solid var(--teal); outline-offset: -2px; }
table.data td.cell.opt input { background: #FFFBEA; }
table.data td.cell input.imp { box-shadow: inset 3px 0 0 #8BB8BE; }
table.data .neg { color: var(--crit); }
.pertitle { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); }

/* status */
.st { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.st.ok { background: var(--ok-bg); color: var(--ok); }
.st.chk { background: var(--chk-bg); color: var(--chk); }
.st.risk { background: var(--risk-bg); color: var(--risk); }
.st.crit { background: var(--crit-bg); color: var(--crit); }
.st.nd { background: var(--nd-bg); color: var(--nd); }

/* ratio map: the signature element */
table.rmap td.v { position: relative; min-width: 104px; }
table.rmap td.v span.val { position: relative; z-index: 1; }
table.rmap td.v.ok { background: var(--ok-bg); color: var(--ok); }
table.rmap td.v.chk { background: var(--chk-bg); color: var(--chk); }
table.rmap td.v.risk { background: var(--risk-bg); color: var(--risk); }
table.rmap td.v.crit { background: var(--crit-bg); color: var(--crit); font-weight: 600; }
table.rmap td.v.nd { color: var(--nd); }
table.rmap td.trend { width: 92px; padding: 2px 8px; }
table.rmap td.lab .formula { display: block; font-size: 12px; color: var(--muted); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: 10px 2px 0; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); margin-bottom: 16px; }
.facts div { padding: 12px 16px; border-right: 1px solid var(--rule-soft); }
.facts div:last-child { border-right: 0; }
.facts b { display: block; font-size: 19px; font-family: var(--serif); font-weight: 600; margin-top: 2px; }
.facts span { color: var(--muted); font-size: 12.5px; }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; border-bottom: 1px solid var(--rule); }
.tabs button { border: 0; background: none; padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); }
.tabs button[aria-selected="true"] { border-bottom-color: var(--teal); color: var(--ink); font-weight: 600; }

/* client list */
.clients { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.clients th, .clients td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--rule-soft); }
.clients th { background: #E9EFF0; color: var(--teal-ink); font-weight: 600; font-size: 13px; }
.clients td:last-child { text-align: right; white-space: nowrap; }
.empty { border: 1px dashed #AFC0C4; border-radius: 10px; padding: 34px; text-align: center; background: var(--surface); }
.empty h2 { margin-bottom: 6px; }

/* dialog */
dialog { border: 0; border-radius: 10px; padding: 0; width: min(680px, 94vw); box-shadow: 0 18px 60px rgba(10, 40, 46, .28); color: var(--ink); }
dialog::backdrop { background: rgba(14, 40, 46, .45); }
dialog .dh { padding: 18px 22px 6px; }
dialog .db { padding: 8px 22px 16px; max-height: 64vh; overflow: auto; }
dialog .df { padding: 12px 22px 18px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--rule-soft); }
.logline { padding: 6px 0; border-bottom: 1px solid var(--rule-soft); font-size: 13px; }
.drop { border: 2px dashed #AFC0C4; border-radius: 8px; padding: 18px; text-align: center; color: var(--muted); background: #FAFCFC; }
.drop.over { border-color: var(--teal); background: var(--teal-soft); }

.toast { position: fixed; bottom: 18px; right: 18px; background: var(--teal-ink); color: #fff; padding: 10px 16px; border-radius: 8px; box-shadow: 0 8px 26px rgba(0,0,0,.2); opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; z-index: 50; }
.toast.on { opacity: 1; transform: none; }
.saved { font-size: 12.5px; color: var(--muted); }
.concl-text { white-space: pre-wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; }
  .main { padding: 18px 16px 40px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  .rail, .toolbar, .noprint { display: none !important; }
  .app { display: block; }
  .main { padding: 0; }
  body { background: #fff; }
  .panel, .tablewrap { border: 0; max-height: none; overflow: visible; }
}
h1, h2, h3, .brand, .facts b { word-spacing: -0.14em; }
table.form th.lab, table.form td.lab { min-width: 56px; width: 56px; }
table.form td { text-align: left; padding: 6px 6px; }
table.form td .inp { min-width: 120px; }
table.form td input[data-f="name"], table.form td input[data-f="label"] { min-width: 230px; }
table.form td select[data-f="role"], table.form td select[data-f="regime"] { min-width: 170px; }
table.chk th:not(.lab), table.chk td:not(.lab) { width: 132px; text-align: center; }
.brand small { word-spacing: normal; }

/* ================= фирменный стиль: белый 70 · лазурно-синий 10 · лайм 10 · графит 5 · платина 5 ================= */
:root {
  --blue: #023DFF; --blue-ink: #0231CC; --blue-soft: #EEF2FF; --lime: #00BB00; --lime-ink: #067A06; --lime-soft: #E6F7E6;
  --graphite: #272727; --platinum: #E5E4E2; --white: #FFFFFF;
  --paper: #FFFFFF; --surface: #FFFFFF; --ink: #272727; --muted: #666666; --rule: #E5E4E2; --rule-soft: #EFEEEC;
  --teal: #023DFF; --teal-ink: #272727; --teal-soft: #F2F2F0;
  --in-bg: #EEF2FF; --in-ink: #0231CC; --calc-bg: #F6F6F5;
  --ok: #067A06; --ok-bg: #E6F7E6;
  --serif: "Futura PT", "Futura", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif;
  --sans: "Roboto", "Segoe UI", system-ui, Arial, sans-serif;
  --note: Verdana, Geneva, "DejaVu Sans", sans-serif;
  --shape: 22px 22px 22px 0;
}
h1, h2, h3, .brand, .facts b { font-family: var(--serif); font-weight: 600; letter-spacing: 0; word-spacing: normal; }
h1 { font-size: 28px; }
/* системные уточнения — Verdana */
.pagehead p, .panel .hint, .muted, .small, .pertitle, .saved, .legend, table.rmap td.lab .formula, label.f > span, .facts span, .brand small, .logline .small {
  font-family: var(--note); font-size: 11.5px; letter-spacing: 0; }
.pagehead p { font-size: 12.5px; line-height: 1.6; }

/* навигация: лазурно-синяя панель, лайм — текущий шаг */
.rail { background: var(--blue); color: #fff; }
.brand { color: #fff; } .brand small { color: #D6DFFF; }
.rail .client { border-color: rgba(255,255,255,.28); }
.rail .client button, .rail .foot, .rail .foot .saved { color: #D6DFFF; }
.steps button { color: #fff; }
.steps li.num button::before { border-color: rgba(255,255,255,.55); color: #fff; }
.steps button:hover { background: rgba(255,255,255,.12); }
.steps button[aria-current="page"] { background: #fff; color: var(--graphite); }
.steps button[aria-current="page"]::before { background: var(--lime); border-color: var(--lime); color: #fff; }
.steps .dot { box-shadow: 0 0 0 2px var(--blue); }
.rail .foot button { color: #fff; }

/* кнопки: синий — основное действие, графит — обводка */
.btn { border-color: var(--platinum); border-radius: 999px; padding: 7px 16px; }
.btn:hover { border-color: var(--graphite); }
.btn.primary { background: var(--blue); border-color: var(--blue); }
.btn.primary:hover { background: var(--blue-ink); }
.btn.ghost { color: var(--blue); }
.seg { border-radius: 999px; border-color: var(--platinum); }
.seg button[aria-pressed="true"] { background: var(--graphite); color: #fff; }
.tabs { border-bottom-color: var(--platinum); }
.tabs button[aria-selected="true"] { border-bottom: 3px solid var(--lime); color: var(--graphite); }

/* поверхности: фирменная форма — три скругления, один прямой угол */
.panel, .facts, .tablewrap, .empty, .clients { border-radius: var(--shape); border-color: var(--platinum); }
.facts { background: var(--white); border: 0; box-shadow: inset 0 0 0 1px var(--platinum); }
.facts div { border-right-color: var(--platinum); }
.facts div:first-child { background: var(--graphite); color: #fff; border-radius: 22px 0 0 0; }
.facts div:first-child span { color: #CFCFCF; }
.empty { border-style: solid; }

/* таблицы: шапка платиновая, разделы — тонкая лаймовая метка */
table.data thead th, .clients th { background: var(--platinum); color: var(--graphite); border-bottom-color: #D2D1CE; }
table.data tr.sec td { background: #fff; color: var(--graphite); border-bottom: 1px solid var(--platinum); box-shadow: inset 4px 0 0 var(--lime); text-transform: none; }
table.data td.cell input { border-left-color: #DCE4FF; }
table.data td.cell.opt input { background: #F6F8FF; }
table.data td.cell input.imp { box-shadow: inset 3px 0 0 var(--lime); }
.inp, select.inp, textarea.inp { border-color: #D6DEFF; }
:focus-visible { outline-color: var(--blue); }
table.data td.cell input:focus { outline-color: var(--blue); }

/* оценки: «норма» — лайм; остальные — функциональные цвета вне палитры (нужны для смысла) */
.st.ok { background: var(--lime-soft); color: var(--lime-ink); }
table.rmap td.v.ok { background: var(--lime-soft); color: var(--lime-ink); }
.drop { border-color: var(--platinum); background: #fff; border-radius: var(--shape); }
.drop.over { border-color: var(--blue); background: var(--blue-soft); }
.toast { background: var(--graphite); }
dialog { border-radius: var(--shape); }
.brand small { font-weight: 400; }
.app { grid-template-columns: 224px 1fr; }

/* проблемы и решения */
.pdot { position: absolute; right: 8px; top: 8px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 11.5px; font-weight: 700; display: none; place-items: center; line-height: 20px; text-align: center; }
.pdot.crit, .pdot.risk, .pdot.chk { display: inline-block; }
.pdot.crit { background: #FF4D4F; color: #fff; } .pdot.risk { background: #FFB020; color: #272727; } .pdot.chk { background: #fff; color: var(--blue); }
.steps button[aria-current="page"] .pdot.chk { background: var(--blue-soft); }
.probs { border: 1px solid var(--platinum); border-radius: var(--shape); padding: 12px 16px; margin-bottom: 14px; background: #fff; box-shadow: inset 4px 0 0 #FFB020; }
.probs-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.prob { display: grid; grid-template-columns: 112px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule-soft); align-items: start; }
.prob:first-of-type { border-top: 0; }
.prob .st { justify-self: start; }
.prob .fix { margin: 4px 0 0; color: #3A3A3A; font-size: 13px; }
.prob .fix::before { content: "Что сделать: "; font-weight: 600; color: var(--blue); }
.st.nd { background: var(--nd-bg); }
table.data td.cell input.bad { outline: 2px solid #FFB020; outline-offset: -2px; background: #FFF6E5; }
table.data td.cell input.bad-crit { outline-color: #FF4D4F; background: #FFEDED; }
table.data td.bad { box-shadow: inset 0 0 0 2px #FFB020; background: #FFF6E5; }
table.data td.bad-crit { box-shadow: inset 0 0 0 2px #FF4D4F; background: #FFEDED; }
table.data .code { display: inline-block; min-width: 34px; color: var(--blue); font-family: var(--note); font-size: 11px; }
table.data tr.sub td.lab { padding-left: 22px; }
/* прогноз */
.fcgrid { display: grid; grid-template-columns: minmax(380px, 1.1fr) 1fr; gap: 22px; align-items: start; }
.fcgrid h3, .panel h3 { font-size: 15px; margin-bottom: 8px; }
table.data.fc td.cell input, .inp.num { text-align: right; }
.inp.num.inl { width: 80px; display: inline-block; padding: 3px 6px; }
.grid2.tight { grid-template-columns: repeat(2, minmax(150px, 1fr)); gap: 10px 14px; }
.seas { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.seas .inp { padding: 5px 6px; }
.fcres { display: grid; grid-template-columns: minmax(420px, 1fr) minmax(360px, 1fr); gap: 22px; align-items: start; }
.chart { width: 100%; height: auto; }
.chart text { font-family: var(--note); font-size: 10px; fill: #666; }
.chart .grid { stroke: #EFEEEC; } .chart .zero { stroke: #272727; stroke-width: .8; }
.chart .buf { stroke: #FFB020; stroke-dasharray: 5 4; stroke-width: 1.4; }
.chart .b { fill: none; stroke: var(--blue); stroke-width: 2.4; } .chart .s { fill: none; stroke: var(--lime); stroke-width: 2.4; }
.legend .ln { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; }
.legend .ln.b { background: var(--blue); } .legend .ln.s { background: var(--lime); } .legend .ln.buf { background: #FFB020; }
table.data td.low { background: #FFF6E5; color: #9A5B00; font-weight: 600; }
@media (max-width: 1100px) { .fcgrid, .fcres { grid-template-columns: 1fr; } }
.rail .back { background: #fff; color: var(--blue); border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 600; cursor: pointer; text-align: left; }
.rail .back:hover { background: var(--lime); color: #fff; }
.copy { font-family: var(--note); font-size: 11px; color: #D6DFFF; margin: 10px 0 0; }
.main > .copy, body > .main .copy { color: #888; }
table.oked td:nth-child(3) .inp { min-width: 380px; }
table.oked td:nth-child(3) .small { display: block; margin-top: 3px; }
table.data th.yr { background: #D9D8D5; }
table.data td.yr { background: #F6F6F5; font-weight: 600; border-left: 1px solid #E5E4E2; }
table.data tr.calc td.yr { background: #EDEDEB; }

/* ================= главная: список клиентов ================= */
.home { max-width: 1180px; margin: 0 auto; padding: 22px 32px 30px; }
.hbar { display: flex; align-items: center; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--platinum); }
.hbar b { font-family: var(--serif); font-size: 19px; font-weight: 600; }
.hbar .hnote { margin-left: auto; font-family: var(--note); font-size: 11px; color: #777; }
.mark { width: 30px; height: 30px; background: var(--blue); border-radius: 10px 10px 10px 0; position: relative; }

р считает в тыс. тг. При автоматическом режиме единицы файла определяются по масштабу других периодов компании, по сумме с тиынами (значит, тенге), по шапке формы («тыс. тенге», «тенге», «млн тенге») и по величине чисел; если однозначно определить нельзя — сайт спросит. Значения сразу приводятся к тыс. тг; в журнале видно, что было сделано.":"Талдағыш мың теңгемен есептейді. Автоматты режимде файлдың өлшем бірліктері компанияның басқа кезеңдерінің ауқымы, тиындары бар сомалар (демек, теңге), нысан тақырыбы («мың теңге», «теңге», «млн теңге») және сандардың шамасы бойынша анықталады; бірмәнді анықтау мүмкін болмаса — сайт сұрайды. Мәндер бірден мың теңгеге келтіріледі; не істелгені журналда көрінеді.","В каких единицах суммы в файлах отчётности?":"Есептілік файлдарындағы сомалар қандай бірлікте?","тыс. тг — сохранить как есть":"мың теңге — сол күйінде сақтау","тг — перевести в тыс. тг":"теңге — мың теңгеге аудару","PDF деклараций, выписок и справок банков тоже можно перетащить сюда — они попадут на страницы «Налоги» и «Банк»; их суммы в тенге и переводятся в тыс. тг автоматически.":"Декларациялардың, үзінділердің және банк анықтамаларының PDF-ін де осында сүйреп әкелуге болады — олар «Салықтар» және «Банк» беттеріне түседі; олардағы сомалар теңгемен және мың теңгеге автоматты түрде аударылады.","выбираются в окне загрузки: «тыс. тг» или «тг»":"жүктеу терезесінде таңдалады: «мың теңге» немесе «теңге»","Анализатор считает в тыс. тг. Единицы файлов отчётности вы указываете в окне загрузки: «тыс. тг» — суммы сохраняются как есть, «тг» — делятся на 1000. Декларации, выписки и справки банков всегда в тенге и переводятся в тыс. тг автоматически. Если выбор не похож на цифры в файле (тиыны при «тыс. тг», слишком маленькие суммы при «тг»), в результате загрузки будет предупреждение.":"Талдағыш мың теңгемен есептейді. Есептілік файлдарының бірліктерін жүктеу терезесінде көрсетесіз: «мың теңге» — сомалар сол күйінде сақталады, «теңге» — 1000-ға бөлінеді. Декларациялар, үзінділе ына келтіру мүмкін емес — деректер шифрланған. Осы браузердегі барлық деректерді жойып, қайта бастауға, ал клиенттерді файлдардан қалпына келтіруге болады («Клиент файлын ашу»).","Восстановлено клиентов:":"Қалпына келтірілген клиенттер:","Вручную":"Қолмен","Вручную (отчёт об изменениях в капитале / решения участников)":"Қолмен (капиталдағы өзгерістер туралы есеп / қатысушылардың шешімдері)","Вручную (расшифровка)":"Қолмен (ашып көрсету)","Все доходы и совокупный годовой доход":"Барлық кірістер және жылдық жиынтық табыс","Все клиенты сохранены в «Загрузки». Файл не зашифрован — храните его в надёжном месте.":"Барлық клиенттер «Жүктеулер» қалтасына сақталды. Файл шифрланбаған — оны сенімді жерде сақтаңыз.","Все проблемы и решения":"Барлық мәселелер мен шешімдер","Все свои пороги будут удалены.":"Барлық өз шектеріңіз жойылады.","Все счета компании в тенге. «Справка» — обороты без детализации, исключения по ним не применяются.":"Компанияның барлық шоттары теңгемен. «Анықтама» — егжей-тегжейсіз айналымдар, оларға алып тастаулар қолданылмайды.","Всего обязательства / Итого активы":"Барлық міндеттемелер / Активтер жиыны","Всего покупателей":"Барлық сатып алушылар","Вспомогательная деятельность по предоставлению финансовых услуг и страхованию":"Қаржылық қызметтер көрсету және сақтандыру жөніндегі қосалқы қызмет","Вставьте сюда (Ctrl+V) и нажмите «Разобрать».":"Осында қойыңыз (Ctrl+V) және «Талдау» батырмасын басыңыз.","Встречность":"Қарсылық","Встречность: внутригрупповая ДЗ = КЗ":"Қарсылық: топішілік ДБ = КБ","Всё, что мешает выводу: ошибки и пропуски в данных, расхождения, зоны риска и дефициты в прогнозе — с подсказкой, что делать. Ячейки с проблемами подсвечены на страницах форм.":"Қорытындыға кедергі келтіретін барлық нәрсе: деректердегі қателер мен олқылықтар, алшақтықтар, тәуекел аймақтары және болжамдағы тапшылықтар — не істеу керектігі туралы кеңеспен. Мәселелі ұяшықтар нысан беттерінде белгіленген.","Выберите год и квартал — дата, число месяцев и название подставятся сами. Для квартала основа «Нарастающим итогом» означает отчётность с начала года (3, 6, 9 мес.), «Отдельный период» — только за этот квартал. Обороты пересчитываются в годовые как ×12/месяцев.":"Жыл мен тоқсанды таңдаңыз — күні, айлар саны және атауы өздігінен қойылады. Тоқсан үшін «Өспелі жиынтықпен» негізі жыл басынан бергі есептілікті (3, 6, 9 ай), «Жеке кезең» — тек осы тоқсанды білдіреді. Айналымдар жылдыққа ×12/айлар ретінде қайта есептеледі.","Выбытие по операционной деятельности, всего":"Операциялық қызмет бойынша шығу, барлығы","Выводы кредитного менеджера":"Кредит менеджерінің қорытындылары","Выдача кредита по договору банковского займа №17":"№17 банктік қарыз шарты бойынша несие беру","Выдача кредитов и займов":"Несиелер мен қарыздар беру","Выписка или справка будет удалена из клиента; обороты и сверка пересчитаются.":"Үзінді немесе анықтама клиенттен жойылады; айналымдар мен салыстыру қайта есептеледі.","Выписка по счёту":"Шот бойынша үзінді","Выписка: проверьте поступления и сохраните":"Үзінді: түсімдерді тексеріп, сақтаңыз","Выписки и справки не загружены":"Үзінділер мен анықтамалар жүктелмеген","Выписки по счетам и справки об оборотах (PDF или Excel из интернет-банка, CSV)":"Шоттар бойынша үзінділер және айналымдар туралы анықтамалар (интернет-банктен PDF немесе Excel, CSV)","Выписки по счетам и справки об оборотах в PDF или Excel. По выпискам выделяются чистые кредитовые обороты: из поступлений исключаются кредиты и займы, конвертация, переводы собственных средств и между своими счетами, выплата вкладов (депозитов), возвраты, финансовая помощь, субсидии (кроме ГЧП), штрафы и пени, выплаты вознаграждения, страховые выплаты, взносы наличными и пополнение через банкомат или кассу (кроме инкассации и поступлений по договорам с ИП). Валюта — по курсу НБ РК на дату поступления.":"Шоттар бойынша үзінділер және айналымдар туралы анықтамалар PDF немесе Excel-де. Үзінділер бойынша таза кредиттік айналымдар бөлінеді: түсімдерден несиелер мен қарыздар, айырбастау, меншікті қаражатты және өз шоттары арасында аудару, салымдарды (депозиттерді) төлеу, қайтарулар, қаржылық көмек, субсидиялар (МЖӘ-ден басқа), айыппұлдар мен өсімпұлдар, сыйақы төлемдері, сақтандыру төлемдері, қолма-қол жарналар және банкомат немесе касса арқылы толықтыру (инкассация мен ЖК-мен шарттар бойынша түсімдерден басқа) алынып тасталады. Валюта — түскен күнгі ҚР ҰБ бағамы бойынша.","Выплата дивидендов":"Дивидендтер төлеу","Выручка":"Түсім","Выручка (компания не плательщик НДС)":"Түсім (компания ҚҚС төлеуші емес)","Выручка за":"Түсім:","Выручка и доход по декларации":"Декларация бойынша түсім және кіріс","Выручка и оборот по НДС":"Түсім және ҚҚС бойынша айналым","Выручка по ОПиУ":"ПЗЕ бойынша түсім","Выручка с НДС":"ҚҚС-мен түсім","Высокая долговая нагрузка. Варианты: уменьшить сумму запроса, удлинить срок, учесть погашения из графика, потребовать дополнительное обеспечение; проверьте, не занижена ли EBITDA разовыми расходами.":"Жоғары борыштық жүктеме. Нұсқалар: сұрау сомасын азайту, мерзімді ұзарту, кестедегі өтеулерді ескеру, қосымша қамтамасыз етуді талап ету; EBITDA біржолғы шығыстармен төмендетілмегенін тексеріңіз.","Высокая степень риска налогоплательщика (КГД)":"Салық төлеушінің жоғары тәуекел дәрежесі (МКК)","Высокая чистая долговая нагрузка — см. рекомендации по «Долг / EBITDA».":"Жоғары таза борыштық жүктеме — «Борыш / EBITDA» бойынша ұсынымдарды қараңыз.","Выше 1,0 — отрицательный капитал.":"1,0-ден жоғары — теріс капитал.","Выше лучше":"Жоғары болса жақсы","Выясните причину просрочки и срок погашения; запросите справку банка об отсутствии просрочки на дату решения. Текущая просрочка — как правило, стоп-фактор.":"Мерзімі өткен берешектің себебін және өтеу мерзімін анықтаңыз; шешім күніне мерзімі өткен берешектің жоқтығы туралы банк анықтамасын сұратыңыз. Ағымдағы мерзімі өткен берешек — әдетте стоп-фактор.","Выясните причину: другой период, выручка не отражена в декларации или в отчётности, НДС включён в одну из сумм, корректировки после сдачи декларации. Запросите расшифровку дохода и, при необходимости, дополнительную декларацию.":"Себебін анықтаңыз: басқа кезең, түсім декларацияда немесе есептілікте көрсетілмеген, ҚҚС сомалардың біріне енгізілген, декларация тапсырылғаннан кейінгі түзетулер. Кірістің ашып көрсетілуін және қажет болса қосымша декларацияны сұратыңыз.","ГКБ":"МКБ","Гарант":"Кепілгер","Гарантия банка":"Банк кепілдігі","Гаранты и созаёмщики":"Кепілгерлер мен бірлескен қарыз алушылар","Гаранты и созаёмщики:":"Кепілгерлер мен бірлескен қарыз алушылар:","Год":"Жыл","Годовой":"Жылдық","Годовой эквивалент EBIT / годовые проценты; при нулевых процентах «н/д»":"EBIT жылдық баламасы / жылдық пайыздар; пайыздар нөл болса «д/ж»","Годовой эквивалент EBITDA / годовые проценты":"EBITDA жылдық баламасы / жылдық пайыздар","Годовой эквивалент ЧП / средние активы (при интервале 12 мес.; иначе на конец периода)":"ТП жылдық баламасы / орташа активтер (12 ай аралықта; әйтпесе кезең соңына)","Годовой эквивалент ЧП / средний капитал; капитал ≤ 0 — критично":"ТП жылдық баламасы / орташа капитал; капитал ≤ 0 — сындарлы","Годовой эквивалент выручки / средние активы":"Түсімнің жылдық баламасы / орташа активтер","Горизонт":"Көкжиек","Горизонт прогноза":"Болжам көкжиегі","Государственное управление и оборона; обязательное социальное обеспечение":"Мемлекеттік басқару және қорғаныс; міндетті әлеуметтік қамсыздандыру","Готово":"Дайын","Гражданское строительство":"Азаматтық құрылыс","Группа (консолидированно)":"Топ (шоғырландырылған)","ДЕЛОВАЯ АКТИВНОСТЬ И ДЕНЕЖНЫЙ ЦИКЛ (с учётом длины периода)":"ІСКЕРЛІК БЕЛСЕНДІЛІК ЖӘНЕ АҚША ЦИКЛІ (кезең ұзақтығын ескере отырып)","ДЕНЕЖНЫЕ ПОТОКИ (косвенная оценка по двум балансам; нужен интервал между балансами = длине периода)":"АҚША АҒЫНДАРЫ (екі баланс бойынша жанама бағалау; баланстар арасындағы аралық = кезең ұзақтығы болуы керек)","ДЗ одной компании группы перед другой должна равняться КЗ второй: запросите акты сверки взаиморасчётов.":"Топтың бір компаниясының екіншісі алдынд теңгеге автоматты түрде аударылады.","анализатор считает в тыс. тг. Единицы файлов отчётности вы указываете в окне загрузки: «тыс. тг» — суммы сохраняются как есть, «тг» — делятся на 1000. Декларации, выписки и справки банков всегда в тенге и переводятся в тыс. тг автоматически. Если выбор не похож на цифры в файле (тиыны при «тыс. тг», слишком маленькие суммы при «тг»), в результате загрузки будет предупреждение.":"талдағыш мың теңгемен есептейді. Есептілік файлдарының бірліктерін жүктеу терезесінде көрсетесіз: «мың теңге» — сомалар сол күйінде сақталады, «теңге» — 1000-ға бөлінеді. Декларациялар, үзінділер және банк анықтамалары әрқашан теңгемен және мың теңгеге автоматты түрде аударылады. Таңдау файлдағы сандарға ұқсамаса («мың теңге» кезінде тиындар, «теңге» кезінде тым кішкентай сомалар), жүктеу нәтижесінде ескерту болады.","файлы:":"файлдар:","расшифровки: проверьте найденные суммы":"ашып көрсетулер: табылған сомаларды тексеріңіз","суммы в тыс. тг. Строки найдены по названию — снимите галочки у лишних (например, у промежуточных итогов, чтобы не посчитать дважды).":"сомалар мың теңгемен. Жолдар атауы бойынша табылды — артықтарынан белгіні алыңыз (мысалы, екі рет есептемеу үшін аралық жиындардан).","разовые доходы/(расходы), нетто":"біржолғы кірістер/(шығыстар), нетто","дивиденды объявленные":"жарияланған дивидендтер","фОТ (оплата труда)":"еАҚ (еңбекақы)","выбранные суммы запишутся в строки ОПиУ «":"таңдалған сомалар осы кезеңге ПЗЕ жолдарына жазылады «","пропустить":"өткізіп жіберу","записать":"жазу","расшифровка":"ашып көрсету","баланс, ОПиУ, ОДДС и расшифровки в Excel (.xlsx, .xlsm, .xls) — можно сразу несколько файлов одной компании за один период. Из расшифровок берутся износ и амортизация, разовые доходы и расходы, дивиденды и ФОТ. Файлы читаются здесь же, в браузере, и никуда не отправляются.":"баланс, ПЗЕ, АҚҚ және ашып көрсетулер Excel-де (.xlsx, .xlsm, .xls) — бір кезеңдегі бір компанияның бірнеше файлын бірден жүктеуге болады. Ашып көрсетулерден тозу  өткен жыл мен ағымдағы жыл (1 қаңтардан) бойынша контрагенттер мен тауарлар бойынша ай сайынғы жиынтық кестелер","нет выписок с поступлениями — загрузите выписки по счетам":"түсімдері бар үзінділер жоқ — шоттар бойынша үзінділерді жүктеңіз","файл анализа выписок сохранён в «Загрузки»":"үзінділерді талдау файлы «Жүктеулер» қалтасына сақталды","агентская деятельность (договор комиссии)":"агенттік қызмет (комиссия шарты)","агентская деятельность (договор комиссии): поступления по комиссии исключены":"агенттік қызмет (комиссия шарты): комиссия бойынша түсімдер алып тасталды","анализ выписок:":"үзінділерді талдау:","баланс + ОПиУ":"баланс + ПЗЕ","баланс подробно":"баланс толық","в расчёте выручки":"түсімді есептеуде","включите условие о переводе оборотов в кредитную документацию; пересмотр лимита через 3 мес.":"айналымдарды аудару шартын несие құжаттамасына енгізіңіз; лимитті 3 айдан кейін қайта қарау.","все поступления из выписок":"үзінділердегі барлық түсімдер","выберите 30 или 90 дней.":"30 немесе 90 күнді таңдаңыз.","выгрузка":"түсіру","выписки":"үзінділер","где открыт счёт (для расчёта лимита)":"шот қайда ашылған (лимитті есептеу үшін)","дата заявки":"өтінім күні","дата регистрации:":"тіркелген күні:","действующих займов:":"қолданыстағы қарыздар:","для этих отраслей — только транш до 30 дней.":"бұл салалар үшін — тек 30 күнге дейінгі транш.","долгосрочные активы":"ұзақ мерзімді активтер","долгосрочные обязательства":"ұзақ мерзімді міндеттемелер","доля крупнейшего покупателя":"ең ірі сатып алушының үлесі","доля пяти крупнейших":"ең ірі беседің үлесі","её доля":"оның үлесі","жёлтая":"сары","загрузите выписки по всем счетам за период; при сезонности укажите «Сезонный бизнес: Да» (период 12 мес.).":"кезеңдегі барлық шоттар бойынша үзінділерді жүктеңіз; маусымдық болса, «Маусымдық бизнес: Иә» деп көрсетіңіз (кезең 12 ай).","загрузите отчёт ПКБ/ГКБ на странице «Кредитная история».":"жНБ/МНБ есебін «Несиелік тарих» бетінде жүктеңіз.","загрузить отчётность":"есептілікті жү аны. Можно удалить все данные в этом браузере и начать заново, а клиентов восстановить из файлов («Открыть файл клиента»).":"пИН-кодты қалпына келтіру мүмкін емес — деректер шифрланған. Осы браузердегі барлық деректерді жойып, қайта бастауға, ал клиенттерді файлдардан қалпына келтіруге болады («Клиент файлын ашу»).","восстановлено клиентов:":"қалпына келтірілген клиенттер:","вручную (отчёт об изменениях в капитале / решения участников)":"қолмен (капиталдағы өзгерістер туралы есеп / қатысушылардың шешімдері)","вручную (расшифровка)":"қолмен (ашып көрсету)","все доходы и совокупный годовой доход":"барлық кірістер және жылдық жиынтық табыс","все клиенты сохранены в «Загрузки». Файл не зашифрован — храните его в надёжном месте.":"барлық клиенттер «Жүктеулер» қалтасына сақталды. Файл шифрланбаған — оны сенімді жерде сақтаңыз.","все проблемы и решения":"барлық мәселелер мен шешімдер","все свои пороги будут удалены.":"барлық өз шектеріңіз жойылады.","все счета компании в тенге. «Справка» — обороты без детализации, исключения по ним не применяются.":"компанияның барлық шоттары теңгемен. «Анықтама» — егжей-тегжейсіз айналымдар, оларға алып тастаулар қолданылмайды.","всего обязательства / Итого активы":"барлық міндеттемелер / Активтер жиыны","всего покупателей":"барлық сатып алушылар","вспомогательная деятельность по предоставлению финансовых услуг и страхованию":"қаржылық қызметтер көрсету және сақтандыру жөніндегі қосалқы қызмет","вставьте сюда (Ctrl+V) и нажмите «Разобрать».":"осында қойыңыз (Ctrl+V) және «Талдау» батырмасын басыңыз.","встречность":"қарсылық","встречность: внутригрупповая ДЗ = КЗ":"қарсылық: топішілік ДБ = КБ","всё, что мешает выводу: ошибки и пропуски в данных, расхождения, зоны риска и дефициты в прогнозе — с подсказкой, что делать. Ячейки с проблемами подсвечены на страницах форм.":"қорытындыға кедергі келтіретін барлық нәрсе: деректердегі қателер мен олқылықтар, алшақтықтар, тәуекел аймақтары және болжамдағы тапшылықтар — не істеу керектігі туралы кеңеспен. Мәселелі ұяшықтар нысан беттерінде белгіленген.","выберите год и квартал — дата, число месяцев и название подставятся сами. Для квартала основа «Нарастающим итогом» означает отчётность с начала года (3, 6, 9 мес.), «Отдельный период» — только за этот квартал. Обороты пересчитываются в годовые как ×12/месяцев.":"жыл мен тоқсанды таңдаңыз — күні, айлар саны және атауы өздігінен қойылады. Тоқсан үшін «Өспелі жиынтықпен» негізі жыл басынан бергі есептілікті (3, 6, 9 ай), «Жеке кезең» — тек осы тоқсанды білдіреді. Айналымдар жылдыққа ×12/айлар ретінде қайта есептеледі.","выбытие по операционной деятельности, всего":"операциялық қызмет бойынша шығу, барлығы","выводы кредитного менеджера":"кредит менеджерінің қорытындылары","выдача кредита по договору банковского займа №17":"№17 банктік қарыз шарты бойынша несие беру","выдача кредитов и займов":"несиелер мен қарыздар беру","выписка или справка будет удалена из клиента; обороты и сверка пересчитаются.":"үзінді немесе анықтама клиенттен жойылады; айналымдар мен салыстыру қайта есептеледі.","выписка по счёту":"шот бойынша үзінді","выписка: проверьте поступления и сохраните":"үзінді: түсімдерді тексеріп, сақтаңыз","выписки и справки не загружены":"үзінділер мен анықтамалар жүктелмеген","выписки по счетам и справки об оборотах (PDF или Excel из интернет-банка, CSV)":"шоттар бойынша үзінділер және айналымдар туралы анықтамалар (интернет-банктен PDF немесе Excel, CSV)","выписки по счетам и справки об оборотах в PDF или Excel. По выпискам выделяются чистые кредитовые обороты: из поступлений исключаются кредиты и займы, конвертация, переводы собственных средств и между своими счетами, выплата вкладов (депозитов), возвраты, финансовая помощь, субсидии (кроме ГЧП), штрафы и пени, выплаты вознаграждения, страховые выплаты, взносы наличными и пополнение через банкомат или кассу (кроме инкассации и поступлений по договорам с ИП). Валюта — по курсу НБ РК на дату поступления.":"шоттар бойынша үзінділер және айналымдар туралы анықтам а).":"алғашқы 24 ай — ай сайын, әрі қарай — жылдар бойынша (жылдық сомалар; ақша — жыл соңына, егер жыл ішінде ең төменгіден төмен түссе, белгіленеді).","перевод собственных средств":"меншікті қаражатты аудару","перевод собственных средств с текущего счета":"ағымдағы шоттан меншікті қаражатты аудару","переводы собственных средств":"меншікті қаражатты аударымдар","перейти":"өту","перенести":"ауыстыру","перенести в прогноз":"болжамға ауыстыру","перенести займы в прогноз?":"қарыздарды болжамға ауыстыру керек пе?","перетащите файлы сюда или нажмите, чтобы выбрать":"файлдарды осында сүйреңіз немесе таңдау үшін басыңыз","перечень АФМ и санкционные списки":"қМА тізбесі және санкциялық тізімдер","перечень загружен:":"тізбе жүктелді:","перечисление заработной платы работникам за месяц":"қызметкерлерге айлық жалақыны аудару","перечни лиц, связанных с терроризмом и экстремизмом, санкции":"терроризм мен экстремизммен байланысты тұлғалар тізбелері, санкциялар","период":"кезең","период «":"кезең «","периоды":"кезеңдер","периоды не по возрастанию: «":"кезеңдер өсу ретімен емес: «","печать / PDF":"басып шығару / PDF","платежи в месяц":"айына төлемдер","платёж в мес.":"айлық төлем","платёж, тыс.":"төлем, мың","по БИН":"бСН бойынша","по выпискам: покупатели — по чистым кредитовым оборотам (без исключённых поступлений), поставщики — по списаниям «поставщикам и прочие». Доля крупнейшего покупателя выше 30 % — зависимость, выше 50 % — риск.":"үзінділер бойынша: сатып алушылар — таза кредиттік айналымдар бойынша (алынып тасталған түсімдерсіз), жеткізушілер — «жеткізушілерге және басқалар» есептен шығарулары бойынша. Ең ірі сатып алушының үлесі 30 %-дан жоғары — тәуелділік, 50 %-дан жоғары — тәуекел.","по данным Параграфа («Смежные предприятия»): если компаний с похожим адресом или у того же руководителя больше порога, пункт «Массовый адрес, руководитель» получает отметку «есть».":"параграф деректері бойынша («Аралас кәсіпорындар»): ұқсас мекенжайы бар немесе сол басшыдағы компаниялар шек   if (!(g("rev") > 0) || !(g("cogs") > 0)) return { err: "выручка и себестоимость последнего периода должны быть больше нуля" };
  const P = {}; for (const [k, v] of Object.entries(f.scen)) P[k] = N(v[s]);
  const rev0 = g("rev") * A, cogs0 = g("cogs") * A, opex0 = (g("selling") + g("admin")) * A, da0 = g("da") * A;
  const gmH = (rev0 - cogs0) / rev0, gm = gmH + P.gm_adj;
  const dso = g("ar") / rev0 * 365 + P.dso_adj, dio = g("inv") / cogs0 * 365 + P.dio_adj, dpo = g("ap") / cogs0 * 365 + P.dpo_adj;
  const seas = f.seas.map(Number), sseas = seas.reduce((a, b) => a + b, 0) || 12;
  const lastMonth = parseInt((C.periods[perIdx(L)].date || "").slice(5, 7), 10) || 12;
  const cal = t => ((((lastMonth - 1 + t) % 12) + 12) % 12) + 1;
  const I = new Array(H + 1).fill(0), PR = new Array(H + 1).fill(0);
  for (const ln of existingLoans(obj)) {
    if (!(N(ln.bal) > 0)) continue;
    const [it, pr] = amort(N(ln.bal), N(ln.rate) + P.rshock, Math.max(1, N(ln.rem) || 1), N(ln.grace), SCH[ln.scheme] || 1, null, null, H);
    for (let t = 0; t <= H; t++) { I[t] += it[t]; PR[t] += pr[t]; }
  }
  const R = f.req, [nI, nP] = N(R.amt) > 0 ? amort(N(R.amt), N(R.rate) + P.rshock, Math.max(1, N(R.term)), N(R.grace), SCH[R.scheme] || 1, null, Math.max(1, N(R.month)), H) : [new Array(H + 1).fill(0), new Array(H + 1).fill(0)];
  const icapex = t => f.projects.reduce((a, p) => a + (t >= N(p.start) && t < N(p.start) + N(p.dur) ? N(p.amt) / Math.max(1, N(p.dur)) : 0), 0) * (1 + P.overrun);
  const dpm = 365 / 12, rows = [], revs = [], cogss = [];
  let cashPre = g("cash") + g("stinv"), cashPost = cashPre, nbal = 0, nwcPrev = g("ar") + g("inv") - g("ap");
  const nwcOpen = nwcPrev;
  const histRev = m => rev0 / 12 * seas[cal(m) - 1] * 12 / sseas;
  for (let t = 1; t <= H; t++) {
    const rev = rev0 / 12 * Math.pow(1 + P.growth, (t + 5.5) / 12) * seas[cal(t) - 1] * (1 + P.shock);
    const cogs = rev * (1 - gm), opex = opex0 / 12 * Math.pow(1 + P.infl, (t + 5.5) / 12);
    const ebit = rev - cogs - opex, da = da0 / 12, ebitda = ebit + da;
    const ebt = ebit - I[t], cit = Math.max(0, ebt) * N(f.cit);
    revs.push(rev); cogss.push(cogs);
    const rv = [t - 2, t - 1, t].map(m => (m >= 1 ? revs[m - 1] : histRev(m)));
    const cg = [t - 2, t - 1, t].map(m => (m >= 1 ? cogss[m - 1] : histRev(m) * (1 - gmH)));
    const avr = rv.reduce((a, b) => a + b, 0) / 3, avc = cg.reduce((a, b) => a + b, 0) / 3;
    const nwc = avr * dso / dpm + avc * dio / dpm - avc * dpo / dpm, dn = nwc - nwcPrev;
    const cfo = ebitda - cit - dn, mc = rev * P.capex_pct, cfads = cfo - mc, ds = I[t] + PR[t], ic = icapex(t);
    const cfPre = cfads - ds - ic; cashPre += cfPre;
    const draw = t === N(R.month) ? N(R.amt) : 0;
    cashPost = cashPost + cfPre + draw - nP[t] - nI[t]; nbal = nbal + draw - nP[t];
    const dsAll = ds + nP[t] + nI[t];
    rows.push({ t, cal: cal(t), rev, ebitda, cit, dn, cfo, mc, cfads, ds, ic, cfPre, cashPre, draw, nprin: nP[t], nint: nI[t], cashPost, nbal, dsAll,
      dscr: ds > 0 ? cfads / ds : null, dscrAll: dsAll > 0 ? cfads / dsAll : null, nwc });
    nwcPrev = nwc;
  }
  const sum = k => rows.reduce((a, r) => a + r[k], 0), y1 = rows.slice(0, 12);
  const o = { rows };
  o.rev_total = sum("rev"); o.ebitda_total = sum("ebitda"); o.ebitda_y1 = y1.reduce((a, r) => a + r.ebitda, 0); o.cfads_total = sum("cfads"); o.ds_total = sum("ds"); o.ds_all_total = sum("dsAll");
  o.dscr_h_pre = o.ds_total > 0 ? o.cfads_total / o.ds_total : null;
  o.dscr_h_post = o.ds_all_total > 0 ? o.cfads_total / o.ds_all_total : null;
  const y1ds = y1.reduce((a, r) => a + r.dsAll, 0); o.dscr_y1_post = y1ds > 0 ? y1.reduce((a, r) => a + r.cfads, 0) / y1ds : null;
  o.mincash_pre = Math.min(...rows.map(r => r.cashPre)); o.mincash_post = Math.min(...rows.map(r => r.cashPost));
  o.gap_max = Math.max(...rows.map(r => Math.max(0, P.buffer - r.cashPre)));
  o.months_below = rows.filter(r => r.cashPost < P.buffer).length;
  o.nwc_open = nwcOpen; o.nwc_peak = Math.max(...rows.map(r => r.nwc)); o.nwc_need = Math.max(0, o.nwc_peak - nwcOpen);
  o.inv_total = f.projects.reduce((a, p) => a + N(p.amt), 0) * (1 + P.overrun);
  o.inv_need = f.projects.reduce((a, p) => a + N(p.amt) * (1 - N(p.own)), 0) * (1 + P.overrun);
  o.rec = o.gap_max > 0 ? Math.ceil(o.gap_max * (1 + N(f.reserve)) / 1000) * 1000 : 0;
  const da = rows.map(r => r.dscrAll).filter(isNum); o.dscr_min_post = da.length ? Math.min(...da) : null;
  o.buffer = P.buffer; o.H = H;
  // годовые итоги (год 1, 2, …): DSCR по годам
  o.years = [];
  for (let y = 0; y * 12 < H; y++) {
    const rr = rows.slice(y * 12, y * 12 + 12), cf = rr.reduce((a, r) => a + r.cfads, 0), dsa = rr.reduce((a, r) => a + r.dsAll, 0);
    o.years.push({ y: y + 1, cfads: cf, dsAll: dsa, dscr: dsa > 0 ? cf / dsa : null, cashEnd: rr[rr.length - 1].cashPost });
  }
  const yd = o.years.map(y => y.dscr).filter(isNum); o.dscr_year_min = yd.length ? Math.min(...yd) : null;
  return o;
}

function problems() {
  const out = [], tol = N(C.card.tol) || 1, pers = C.periods;
  const add = (sev, page, title, detail, fix, cells) => out.push({ sev, page, title, detail, fix, cells: cells || [] });
  // периоды
  pers.forEach((p, i) => {
    const m = parseInt((p.date || "").slice(5, 7), 10), d = new Date(p.date);
    if (!p.date || isNaN(d)) add("chk", "card", `Период «${p.label}»: не указана дата отчёта`, "", "Укажите дату отчёта на «Карточке» (последний день периода).");
    else {
      if (i > 0 && pers[i - 1].date && p.date <= pers[i - 1].date) add("risk", "card", `Периоды не по возрастанию: «${pers[i - 1].label}» → «${p.label}»`, "", "Расположите периоды от старого к новому (удалите и добавьте заново или поправьте даты).");
      if ((p.basis === "Годовой" || p.basis === "LTM") && p.months !== 12) add("chk", "card", `Период «${p.label}»: годовая основа, но ${p.months} мес.`, "", "Для годового периода и LTM укажите 12 месяцев.");
      if (p.basis === "Нарастающим итогом" && m && p.months !== m) add("chk", "card", `Период «${p.label}»: нарастающим итогом, месяцев ${p.months}, а дата — ${m}-й месяц`, "", `Укажите ${m} мес. (с начала года до даты отчёта).`);

  for (let k = 1; k <= nComp(); k++) {
    const nm = compName(k);
    pers.forEach((p, i) => {
      const pid = p.id, g = key => val(k, key, pid);
      if (inactive(k, pid)) return;
      const pr = nComp() > 1 ? partialReg(k, pid) : "";
      if (pr) add("chk", "card", `${nm}, ${p.label}: неполный период деятельности`, `зарегистрирована ${pr}`, "Компания работала не весь период: обороты и прибыль за него ниже годовых. Учитывайте это при сравнении с другими периодами и в прогнозе.");
      for (const blk of ["bal", "odr"]) {
        const miss = INPUT_KEYS.filter(key => LINE[key].typ === "in" && LINE[key].block === blk && rawComp(k, key, pid) === null);
        if (miss.length && miss.length < INPUT_KEYS.filter(key => LINE[key].typ === "in" && LINE[key].block === blk).length)
          add("chk", blk, `${nm}, ${p.label}: в ${blk === "bal" ? "балансе" : "ОПиУ"} не заполнено строк: ${miss.length}`, miss.slice(0, 6).map(x => LINE[x].label).join("; ") + (miss.length > 6 ? "…" : ""),
            "Введите значения или загрузите форму. Если статьи у компании нет — поставьте 0 (пусто означает «нет данных», расчёты не строятся).", miss.map(key => ({ k, key, pid })));
        else if (miss.length) add("nd", blk, `${nm}, ${p.label}: ${blk === "bal" ? "баланс" : "ОПиУ"} не заполнен`, "", "Загрузите форму из Excel или введите вручную.");
      }
      if (isNum(g("bchk")) && Math.abs(g("bchk")) > tol) {
        const d = g("bchk"), cand = INPUT_KEYS.filter(key => LINE[key].block === "bal" && isNum(rawComp(k, key, pid)) && rawComp(k, key, pid) !== 0 && (Math.abs(Math.abs(rawComp(k, key, pid)) - Math.abs(d)) <= tol || Math.abs(2 * Math.abs(rawComp(k, key, pid)) - Math.abs(d)) <= tol));
        let fix = `Активы ${d > 0 ? "больше" : "меньше"} пассивов на ${fmt(Math.abs(d))}. Сверьте итоги с формой: «Итого активов / обязательств / капитала — по отчётности» покажут, в каком разделе ошибка.`;
        if (cand.length) fix += " Разница совпадает со строкой: " + cand.map(x => `«${LINE[x].label}»`).join(", ") + " — возможно, она пропущена, учтена дважды или с неверным знаком.";
        if (isNum(rawComp(k, "re", pid)) && Math.abs(2 * rawComp(k, "re", pid) + d) <= tol) fix += " Похоже, непокрытый убыток введён без минуса.";
        add("crit", "bal", `${nm}, ${p.label}: баланс не сходится`, `Разница ${fmt(d)}`, fix, [{ k, key: "bchk", pid }, ...cand.map(key => ({ k, key, pid }))]);

        if (isNum(g(rep)) && isNum(s) && Math.abs(s - g(rep)) > tol)
          add("risk", "bal", `${nm}, ${p.label}: итог ${lab} не совпадает с отчётностью`, `По статьям ${fmt(s)}, в отчётности ${fmt(g(rep))}, разница ${fmt(s - g(rep))}`, "Сверьте статьи раздела с формой; при загрузке из файла проверьте «Настройку загрузки» — какие коды попадают в этот раздел.", [{ k, key: rep, pid }]);

      const pp = i > 0 ? pers[i - 1].id : null;

        const eo = eqOther(k, pid), e = C.eqmv?.[k]?.[pid];
        const d = (g("re") - val(k, "re", pp)) - (g("ni") - g("div")) - (eo || 0);
        if (Math.abs(d) > tol) add("chk", "bal", `${nm}, ${p.label}: изменение нераспределённой прибыли не объясняется ${e ? "прибылью, дивидендами и отчётом об изменениях в капитале" : "прибылью и дивидендами"}`, `Разница ${fmt(d)}`,

      }
      for (const key of ["cash", "ar", "inv", "rev", "cogs", "ppe", "ap"]) { const v = rawComp(k, key, pid); if (isNum(v) && v < 0) add("risk", LINE[key].block, `${nm}, ${p.label}: отрицательное значение «${LINE[key].label}»`, fmt(v), "Эта статья не может быть отрицательной. Проверьте знак; расходы вводятся положительными числами.", [{ k, key, pid }]); }
      if (pp) for (const key of ["rev", "ta"]) {
        const a = val(k, key, pid), b = val(k, key, pp);
        if (allNum(a, b) && a > 0 && b > 0 && (a / b > 300 || b / a > 300))
          add("crit", key === "rev" ? "odr" : "bal", `${nm}: «${LINE[key].label}» отличается в ${fmt(Math.max(a / b, b / a), "d")} раз между «${pers[i - 1].label}» и «${p.label}»`, "", "Похоже, один из периодов загружен в тенге, а другой — в тыс. тенге. Загрузите форму повторно и выберите «тенге» в вопросе о единицах.", [{ k, key, pid }]);

        add("risk", "cf", `${nm}, ${p.label}: деньги на конец по ОДДС не равны деньгам в балансе`, `ОДДС ${fmt(g("cf150"))}, баланс ${fmt(g("cash"))}`, "Проверьте строку 140 (начало периода), влияние курсов (120) и полноту строк «в том числе»; при загрузке — единицы файла.", [{ k, key: "cf150", pid }, { k, key: "cf140", pid }]);

function compByBin(bin) {
  if (!bin) return 0;
  const i = C.companies.findIndex(x => String(x.bin || "").replace(/\D/g, "") === bin);

async function readDoc(file) {
  if (/\.pdf$/i.test(file.name)) {
    const r = await DocParse.read(await file.arrayBuffer());
    if (r.pdf.noText) throw new Error("в PDF нет текста — это скан или картинка. Введите суммы вручную");
    return r;
  }
  if (/\.(xlsx|xlsm|xls)$/i.test(file.name)) return DocParse.readSheets(await readWorkbook(await file.arrayBuffer()));
  if (/\.csv$/i.test(file.name)) return DocParse.readSheets(csvSheets(await file.arrayBuffer()));
  if (/\.(html?|mht)$/i.test(file.name)) { const pdf = htmlToLines(await file.arrayBuffer()); if (!pdf.pages[0].lines.length) throw new Error("в HTML-файле нет текста"); return DocParse.readLines(pdf); }

}

      if (!kind) { rep.push({ file: file.name, err: "пропущено" }); continue; }
      if (kind === "decl") r.decl = DocParse.parseDecl(r.pdf); else if (kind === "credit") r.credit = DocParse.parseCredit(r.pdf); else if (kind === "stmt") r.stmt = DocParse.parseStmt(r.pdf); else r.bank = DocParse.parseBank(r.pdf);

      const doc = { id: uid(), k: compByBin(d.bin) || kDef, file: file.name, form: d.form, formName: d.formName, year: d.year, part: d.part, vid: d.vid || (/(^|[^а-яa-z])доп/i.test(file.name) ? "add" : "main"), bin: d.bin, lines: d.lines, vals, src: keys, t: Date.now() };

/* ---------- HTML (например, кредитный отчёт ПКБ): строки таблиц и абзацы → те же «строки с ячейками», что и для PDF */
function htmlToLines(buf) {
  const u8 = new Uint8Array(buf);
  let head = new TextDecoder("latin1").decode(u8.subarray(0, 4096)), cs = (/charset\s*=\s*["']?([\w-]+)/i.exec(head) || [])[1] || "utf-8";
  if (u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) cs = "utf-8";
  let text; try { text = new TextDecoder(cs).decode(u8); } catch (e) { text = new TextDecoder("utf-8").decode(u8); }
  if (/utf-?8/i.test(cs) && text.includes("\uFFFD")) text = new TextDecoder("windows-1251").decode(u8);
  const doc = new DOMParser().parseFromString(text, "text/html");   // документ инертен: скрипты и картинки не запускаются и не грузятся
  doc.querySelectorAll("script,style,noscript,template").forEach(e => e.remove());
  const clean = s => String(s || "").replace(/[\u00A0\s]+/g, " ").trim();
  const lines = []; let y = 0;
  const push = cells => { const cs2 = cells.filter(c => c.s); if (!cs2.length) return; lines.push({ y: -(y += 12), fs: 10, cells: cs2, text: cs2.map(c => c.s).join("  "), page: 0 }); };
  const BLOCK = /^(P|DIV|H[1-6]|LI|SPAN|B|STRONG|TD|TH|LABEL|DT|DD|CAPTION)$/;
  const walk = el => {
    for (const ch of el.children) {
      if (ch.tagName === "TABLE") { for (const tr of ch.querySelectorAll(":scope > tr, :scope > thead > tr, :scope > tbody > tr, :scope > tfoot > tr")) row(tr); continue; }
      if (ch.querySelector("br") && !ch.querySelector("table, p, div, li")) { for (const part of ch.innerHTML.split(/<br\s*\/?>/i)) { const d = doc.createElement("div"); d.innerHTML = part; const t = clean(d.textContent); if (t) push([{ x: 0, x2: 90, s: t, fs: 10 }]); } continue; }
      if (ch.querySelector("table, p, div, li, h1, h2, h3, h4, h5, h6") && !/^(SPAN|B|STRONG)$/.test(ch.tagName)) { walk(ch); continue; }
      if (BLOCK.test(ch.tagName) || ch.children.length === 0) { const t = clean(ch.textContent); if (t) push([{ x: 0, x2: 90, s: t, fs: 10 }]); }
      else walk(ch);
    }
  };
  const row = tr => {
    const cells = []; let col = 0; const nested = [];
    for (const td of tr.children) {
      if (!/^(TD|TH)$/.test(td.tagName)) continue;
      const span = Math.max(1, +td.getAttribute("colspan") || 1);
      const inner = td.querySelector("table");
      if (inner) nested.push(td);
      else cells.push({ x: col * 100, x2: col * 100 + 90, s: clean(td.innerText !== undefined && td.innerText ? td.innerText : td.textContent), fs: 10 });
      col += span;
    }
    push(cells);
    for (const td of nested) walk(td);
  };
  walk(doc.body || doc.documentElement);
  return { pages: [{ lines }], noText: !lines.length };
}

"use strict";
/* ---------------------------------------------------------------- «Кредиты и залог»: кредитные отчёты, реестр займов, залоги, гаранты.
   Плюс аналитика выписок для «Банка»: покупатели, списания по видам, сезонность. Суммы документов — в тенге, на экране — тыс. тг. */
function ensureCredit(c = C) { if (!c) return; c.cr = c.cr || []; c.coll = c.coll || []; c.guar = c.guar || []; }
const COLL_TYPES = { "Недвижимость": 0.3, "Земельный участок": 0.4, "Транспорт": 0.4, "Спецтехника и оборудование": 0.5, "Товары в обороте (ТМЗ)": 0.5, "Деньги на депозите": 0, "Права требования": 0.5, "Гарантия банка": 0, "Гарантия физического лица": 0, "Гарантия юридического лица": 0, "Гарантия АО «ФРП «Даму»": 0, "Прочее": 0.5 };
const pledgorDefault = () => { const i = C.companies.findIndex(x => compRoles(x).includes("Залогодатель")); return compName(i >= 0 ? i + 1 : 1); };
const isoToday = () => new Date().toISOString().slice(0, 10);
function monthsLeft(end, from) {
  if (!end) return null;
  const a = new Date((from || C.card.date || isoToday()) + "T00:00:00Z"), b = new Date(end + "T00:00:00Z");
  if (isNaN(a) || isNaN(b)) return null;
  return Math.max(0, (b.getUTCFullYear() - a.getUTCFullYear()) * 12 + b.getUTCMonth() - a.getUTCMonth() + (b.getUTCDate() >= a.getUTCDate() ? 0 : -1) + 1);
}
const crKzt = x => (x.cur && x.cur !== "KZT" ? (fxRate(x.cur, isoToday().slice(0, 7)) || fxRate(x.cur, isoToday()) || null) : 1);
const isGuar = x => /гарант|поручит|залогодат/i.test(x.role || "") || /гаранти/i.test(x.type || "");
function crSummary(k) {
  ensureCredit();
  const act = C.cr.filter(x => x.k === k && x.status !== "closed"), own = act.filter(x => !isGuar(x)), gu = act.filter(isGuar);
  let debt = 0, pay = 0, nofx = 0; for (const x of own) { const r = crKzt(x); if (r === null) { nofx++; continue; } debt += N(x.bal) * r; pay += N(x.pay) * r; }
  const guarAmt = gu.reduce((a, x) => a + N(x.bal) * (crKzt(x) || 0), 0);
  const od = Math.max(0, ...act.map(x => N(x.odDays))), maxOd = Math.max(0, ...C.cr.filter(x => x.k === k).map(x => Math.max(N(x.maxOd), N(x.odDays))));
  return { n: own.length, debt: debt / 1000, pay: pay / 1000, guar: guarAmt / 1000, od, maxOd, nofx, any: C.cr.some(x => x.k === k) };
}
function creditChecks(k) {
  const s = crSummary(k); if (!s.any) return [];
  const L = lastPid(), out = [], bd = L ? ratio(k, "debt", L) : null;
  if (isNum(bd)) {
    const diff = s.debt - bd, rel = Math.abs(diff) / Math.max(Math.abs(bd), Math.abs(s.debt), 1);
    out.push({ id: "debt", title: "Долг по кредитному отчёту и по балансу", st: Math.abs(diff) <= (N(C.card.tol) || 1) || rel <= 0.1 ? "ok" : rel > 0.3 ? "risk" : "chk", a: bd, b: s.debt, diff, rel,
      det: `баланс (${C.periods[perIdx(L)].label}) ${fmt(bd)}, кредитный отчёт ${fmt(s.debt)}, разница ${fmt(diff)} (${pctFmt(rel)})`,
      fix: "Даты разные: баланс — на отчётную дату, кредитный отчёт — на дату формирования. Если разница большая — проверьте, все ли займы отражены в балансе (в т.ч. от участников и нефинансовых организаций), и запросите расшифровку займов.", cells: [{ k, key: "stloan", pid: L }, { k, key: "ltloan", pid: L }] });
  }
  if (s.od > 0) out.push({ id: "od", title: "Текущая просрочка по кредитам", st: s.od > 30 ? "crit" : "risk", det: `${s.od} дн.`, fix: "Выясните причину просрочки и срок погашения; запросите справку банка об отсутствии просрочки на дату решения. Текущая просрочка — как правило, стоп-фактор." });
  else if (s.maxOd > 30) out.push({ id: "maxod", title: "Просрочки в кредитной истории", st: "chk", det: `максимум ${s.maxOd} дн.`, fix: "Уточните период и причину просрочки; отразите в заключении, была ли она урегулирована." });
  if (s.guar > 0) out.push({ id: "guar", title: "Обязательства компании как гаранта", st: "chk", det: `${fmt(s.guar)} тыс. тг`, fix: "Учитывайте условные обязательства: оцените финансовое положение должников, за которых выдана гарантия." });
  return out;
}
function creditProblems(add) {
  if (!C) return; ensureCredit();
  for (let k = 1; k <= nComp(); k++) for (const c of creditChecks(k)) if (c.st !== "ok") add(c.st, "credit", `${compName(k)}: ${c.title.toLowerCase()}`, c.det, c.fix, c.cells || []);
  const cv = collCover();
  if (cv && isNum(cv.cover) && cv.cover < 1.2) add(cv.cover < 1 ? "risk" : "chk", "coll", `Обеспечение покрывает запрашиваемую сумму на ${pctFmt(cv.cover)}`, `залоговая стоимость ${fmt(cv.coll)}, запрос ${fmt(cv.amt)} тыс. тг`, "Добавьте обеспечение, уменьшите сумму или учтите гарантию фонда (например, «Даму»).");
  // концентрация покупателей
  for (let k = 1; k <= nComp(); k++) { const t = topBuyers(k); if (t && t.top1 > 0.3) add(t.top1 > 0.5 ? "risk" : "chk", "bank", `${compName(k)}: высокая зависимость от покупателя`, `${t.rows[0].name} — ${pctFmt(t.top1)} чистых поступлений (${t.label})`, "Оцените устойчивость отношений с покупателем (договор, срок, история), диверсификацию и влияние его ухода на денежный поток; учтите в стресс-сценарии."); }
}

/* ---------- залог */
function collCover() {
  ensureCredit();
  const amt = N(C.card.amount); if (!C.coll.length) return null;
  const mk = C.coll.reduce((a, x) => a + N(x.market), 0), coll = C.coll.reduce((a, x) => a + N(x.market) * (1 - N(x.disc)), 0);
  return { mk, coll, amt, cover: amt > 0 ? coll / amt : null, ltv: coll > 0 && amt > 0 ? amt / coll : null };
}

function creditToForecast() {

/* ---------- аналитика выписок для «Банка» */
function stmtTx(k) {   // все операции выписок компании в тенге, без повторов по счёту и месяцу
  const out = [], seen = new Set(), own = ownOf(k);
  for (const b of C.bank.filter(b => b.k === k && b.kind === "stmt").sort((a, c) => N(c.t) - N(a.t))) {
    const acc = b.acc || "?", mine = new Set((b.txs || []).map(t => t.d.slice(0, 7)).filter(m => !(b.acc && seen.has(acc + "|" + m))));
    (b.txs || []).forEach((t, i) => {
      const m = t.d.slice(0, 7); if (!mine.has(m)) return;
      const cr = t.cr ? txKzt(b, t, t.cr) : 0, db = t.db ? txKzt(b, t, t.db) : 0;
      out.push({ t, m, cr: N(cr), db: N(db), cat: t.cr ? txCat(b, i, t, own)[0] : null, dcat: t.db ? DocParse.classifyDebit(t, own) : null, b, i });
    });
    for (const m of mine) seen.add(acc + "|" + m);
  }
  return out;
}
function bankPeriod(k) {  // последний период анализа, по которому есть выписки
  const tx = stmtTx(k); if (!tx.length) return null;
  const ms = new Set(tx.map(x => x.m));
  for (let i = C.periods.length - 1; i >= 0; i--) { const w = perMonths(C.periods[i]); const n = w.filter(m => ms.has(m)).length; if (n) return { p: C.periods[i], win: new Set(w), cov: n, need: w.length, tx }; }
  const all = [...ms].sort(); return { p: null, win: new Set(all), cov: all.length, need: all.length, tx };
}
function topBuyers(k) {
  const bp = bankPeriod(k); if (!bp) return null;
  const by = new Map(); let tot = 0;
  for (const x of bp.tx) { if (!bp.win.has(x.m) || !x.cr || x.cat) continue; const key = x.t.bin || DocParse.clean(x.t.cp) || "без названия"; const o = by.get(key) || { name: x.t.cp || key, bin: x.t.bin, v: 0, n: 0 }; o.v += x.cr; o.n++; by.set(key, o); tot += x.cr; }
  if (!tot) return null;
  const rows = [...by.values()].sort((a, b) => b.v - a.v);
  return { rows: rows.slice(0, 10), tot, top1: rows[0].v / tot, top5: rows.slice(0, 5).reduce((a, o) => a + o.v, 0) / tot, n: rows.length, label: bp.p ? bp.p.label : "все выписки", cov: bp.cov, need: bp.need };
}
function topSuppliers(k) {
  const bp = bankPeriod(k); if (!bp) return null;
  const by = new Map(); let tot = 0;
  for (const x of bp.tx) { if (!bp.win.has(x.m) || !x.db || x.dcat !== "sup") continue; const key = x.t.bin || DocParse.clean(x.t.cp) || "без названия"; const o = by.get(key) || { name: x.t.cp || key, bin: x.t.bin, v: 0, n: 0 }; o.v += x.db; o.n++; by.set(key, o); tot += x.db; }
  if (!tot) return null;
  return { rows: [...by.values()].sort((a, b) => b.v - a.v).slice(0, 10), tot };
}

    ${cs.any && cs.pay ? `<tr class="sec"><td class="lab" colspan="${pers.length + 1}">Для сравнения</td></tr><tr><td class="lab">Платежи по кредитам по кредитному отчёту (в мес. × 12, на дату отчёта)</td>${pers.map((p, i) => `<td>${i === pers.length - 1 ? fmt(cs.pay * 12) : ""}</td>`).join("")}</tr>` : ""}

  return h;

// сезонность выручки по чистым кредитовым оборотам (среднее по годам, среднее = 1)
function bankSeasonality() {
  const ks = C.obj > 0 ? [C.obj] : C.companies.map((_, i) => i + 1), byM = {};
  for (const k of ks) for (const [m, o] of Object.entries(bankMonths(k))) byM[m] = (byM[m] || 0) + o.net;
  const ms = Object.keys(byM).filter(m => byM[m] > 0).sort();
  if (ms.length < 12) return null;
  const last = ms.slice(-24), acc = new Array(12).fill(0), cnt = new Array(12).fill(0);
  for (const m of last) { const i = +m.slice(5, 7) - 1; acc[i] += byM[m]; cnt[i]++; }
  if (cnt.some(c => !c)) return null;
  const avg = acc.map((v, i) => v / cnt[i]), mean = avg.reduce((a, b) => a + b, 0) / 12;
  return avg.map(v => Math.round(v / mean * 100) / 100);
}

/* ---------------------------------------------------------------- Расшифровки (Excel без кодов строк): износ и амортизация, разовые доходы/расходы,

const DEC_RULES = [
  { key: "da", re: /(амортизац|(?:^|[^а-яё])износ|истощени)/, not: /(накоплен|на\s+начало|на\s+конец|остаточн|первоначальн|балансов|(?:^|[^а-яё])ос\s+на)/, why: "износ и амортизация" },

  { key: "nonrec", sign: -1, re: /(убыт\S*\s+от\s+(выбыти|реализаци|обесцен|продаж|переоценк)|расход\S*\s+(по|от)\s+(выбыти|реализаци\S*\s+(основн|ос(?![а-яё])))|обесценени|списани\S*\s+(дебиторск|запас|тмз|основн|актив|безнадеж|нма|недостач)|отрицательн\S*\s+курсов|расход\S*\s+(по|от)\s+курсов|курсов\S*\s+разниц\S*\s*\(?\s*расход|(?:^|[^а-яё])штраф|(?:^|[^а-яё])пени(?![а-яё])|неустойк|спонсор|благотвор|безвозмездн\S*\s+(переда|переч)|недостач|хищени|чрезвычайн|расход\S*\s+на\s+ликвидац)/, why: "разовый расход" },

// колонка суммы отчётного периода: по году периода или «отчётный / текущий» в шапке; иначе — колонка, где чаще всего стоят суммы

    const row = rows[r]; if (!row) continue;
    for (let c = 1; c < row.length; c++) {
      const v = row[c];

}

    if (!texts.length || !nums.length) continue;
    if (form && coded) { ctx = normTxt(sh.name + " " + texts.join(" ")); continue; }   // в форме — только строки без кода; строка с кодом задаёт раздел

}

  const obj = C.obj || 0, ov = (pid, key) => o.fin.v?.[pid]?.[key];
  const base = (pid, key) => { const g = kk => val(obj, kk, pid); if (key === "dz") return allNum(g("ar"), g("oar")) ? g("ar") + g("oar") : g("ar"); return g(key); };

}

const $ = (s, el = document) => el.querySelector(s);
let PAGE = "card", COMP_TAB = 1, AN_TAB = "rat", FC_TAB = 0;
const SEV = { crit: "Критично", risk: "Риск", chk: "Проверить", nd: "Нет данных" };
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2600); }
function paintSaved() { const el = $("#saved"); if (el && lastSaved) el.textContent = "Сохранено в этом браузере, " + dTime(lastSaved); }
const opts = (list, cur) => list.map(x => `<option value="${esc(x)}"${String(x) === String(cur) ? " selected" : ""}>${esc(x)}</option>`).join("");
const stChip = (s, txt) => `<span class="st ${s}">${esc(txt ?? ST[s] ?? "")}</span>`;
const CHK_TXT = { ok: ["ok", "ОК"], bad: ["crit", "Расхождение"], nd: ["nd", "нет данных"], na: ["nd", "—"] };

function render() {
  if (LOCK.on && !LOCK.key) return renderLock();
  if (!C) return renderClients();
  PROB = problems();
  const steps = [["card", "Карточка"], ["trust", "Благонадёжность"], ["bal", "Баланс"], ["odr", "ОПиУ"], ["cf", "ДДС"], ["tax", "Налоги"], ["bank", "Банк"], ["credit", "Кредитная история"], ["coll", "Залог и гаранты"], ["cons", "Свод и прогноз"], ["an", "Анализ"], ["prob", "Проблемы"], ["concl", "Заключение"]];
  if (isOD()) steps.splice(0, steps.length, ["card", "Карточка"], ["trust", "Благонадёжность"], ["fin", "Баланс + ОПиУ"], ["bank", "Банк"], ["credit", "Кредитная история"], ["prob", "Проблемы"], ["concl", "Заключение"]);
  if (!steps.some(st => st[0] === PAGE) && PAGE !== "map" && PAGE !== "log" && PAGE !== "norms" && !(isOD() && (PAGE === "bal" || PAGE === "odr"))) PAGE = "card";
  document.body.innerHTML = `
  <div class="app">
    <nav class="rail" aria-label="Разделы">
      <div class="brand">Финансовый анализ<small>компании и группы РК · локально</small>${langSwitch()}</div>
      <button class="back" data-act="clients">← К списку клиентов</button>
      <div class="client"><b>${esc(C.card.name)}</b><span class="small">${nComp()} комп. · ${C.periods.length} пер.</span></div>
      <ol class="steps">${steps.map(([id, t]) => `<li class="num"><button data-page="${id}" ${PAGE === id ? 'aria-current="page"' : ""}>${t}<span class="pdot" data-pdot="${id}"></span></button></li>`).join("")}</ol>
      <ul class="steps"><li><button data-page="map" ${PAGE === "map" ? 'aria-current="page"' : ""}>Настройка загрузки</button></li><li><button data-page="norms" ${PAGE === "norms" ? 'aria-current="page"' : ""}>Нормативы</button></li><li><button data-page="log" ${PAGE === "log" ? 'aria-current="page"' : ""}>Журнал</button></li></ul>
      <div class="foot"><button data-act="export">Сохранить файл клиента</button><span id="saved" class="saved"></span><p class="copy">© 2026 Создан ОФКК Костанай</p></div>
    </nav>
    <main class="main" id="main">${PAGES[PAGE]()}</main>
  </div><div id="toast" class="toast" role="status"></div>${DIALOG}`;
  paintSaved(); paintProblemMarks();
}
function pageProblems(page) { return PROB.filter(p => p.page === page || (page === "cons" && p.page === "elim")); }
function paintProblemMarks() {
  const rank = { crit: 0, risk: 1, chk: 2, nd: 3 };
  document.querySelectorAll("[data-pdot]").forEach(el => {
    const id = el.dataset.pdot;
    const list = id === "prob" ? PROB.filter(p => p.sev !== "nd") : pageProblems(id).filter(p => p.sev !== "nd");
    if (!list.length) { el.className = "pdot"; el.textContent = ""; return; }
    const worst = list.reduce((a, p) => (rank[p.sev] < rank[a] ? p.sev : a), "chk");
    el.className = "pdot " + worst; el.textContent = list.length; el.title = list.length + " — " + SEV[worst].toLowerCase();
  });
  BAD = badCells();
  document.querySelectorAll("td.cell input[data-key]").forEach(inp => markCell(inp, inp.dataset.k + "|" + inp.dataset.key + "|" + inp.dataset.pid));
  document.querySelectorAll("[data-v]").forEach(td => markCell(td, td.dataset.v));
  const b = $("#probBanner"); if (b) b.innerHTML = bannerHTML(b.dataset.page);
}
let BAD = new Map();
function markCell(el, id) {
  const p = BAD.get(id);
  el.classList.toggle("bad", !!p); el.classList.toggle("bad-crit", !!p && p.sev === "crit");
  if (p) el.title = p.title + (p.detail ? " — " + p.detail : "") + "\nЧто сделать: " + p.fix; else if (el.dataset.src) el.title = el.dataset.src; else el.removeAttribute("title");
}
function bannerHTML(page) {
  const list = pageProblems(page).filter(p => !COMP_FILTER || !p.title.startsWith("К") );
  if (!list.length) return "";
  const shown = list.slice(0, 4);
  return `<div class="probs"><div class="probs-h"><b>${list.length === 1 ? "Требует внимания" : "Требуют внимания: " + list.length}</b><button class="btn ghost" data-page="prob">Все проблемы и решения</button></div>
    ${shown.map(probItem).join("")}${list.length > shown.length ? `<p class="small muted">и ещё ${list.length - shown.length} — на странице «Проблемы и решения».</p>` : ""}</div>`;
}
const COMP_FILTER = false;
function probItem(p) {
  return `<div class="prob ${p.sev}"><span class="st ${p.sev}">${SEV[p.sev]}</span><div><b>${esc(p.title)}</b>${p.detail ? `<span class="small muted"> · ${esc(p.detail)}</span>` : ""}<p class="fix">${esc(p.fix)}</p></div></div>`;
}
const DIALOG = `<dialog id="dlg"><div class="dh"><h2 id="dlgT"></h2></div><div class="db" id="dlgB"></div><div class="df" id="dlgF"></div></dialog>`;

/* ---------- клиенты */
function renderClients() {
  const list = CLIENTS.slice().sort((a, b) => b.updated - a.updated);
  const last = list[0];
  const okedOf = c => (c.card.oked && c.card.oked[0] && c.card.oked[0].code ? "ОКЭД " + c.card.oked[0].code + (c.card.oked[0].name ? " · " + okedNameL(c.card.oked[0].code, c.card.oked[0].name) : "") : (c.card.activity || ""));
  const stOf = c => { const s = c.concl?.status || "Черновик"; return s === "Утверждено" ? ["ok", s] : s === "На проверке" ? ["chk", s] : ["nd", s]; };
  const done = list.filter(c => c.concl?.status === "Утверждено").length;
  const when = d => dDayMonth(d);
