<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data: blob:; connect-src 'self' blob: data:">
<title>Финансовый анализ РК</title>
<style>:root {
  --paper: #F3F6F6; --surface: #FFFFFF; --ink: #17262E; --muted: #5B6B73; --rule: #D5DDE0; --rule-soft: #E7ECEE;
  --teal: #0E5A66; --teal-ink: #0A4650; --teal-soft: #E1EEF0;
  --in-bg: #FFF7D6; --in-ink: #1F4FB8; --calc-bg: #F1F4F5;
  --ok: #2F7A4B; --ok-bg: #E2F1E7; --chk: #9A5B00; --chk-bg: #FBF0D6; --risk: #B9410C; --risk-bg: #FCE6DA;
  --crit: #9B1C3A; --crit-bg: #F7DCE3; --nd: #66727A; --nd-bg: #ECEFF1;
  --serif: "Lora", Georgia, "Times New Roman", serif;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --r: 6px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 26px; line-height: 1.2; }
h2 { font-size: 19px; line-height: 1.3; }
h3 { font-size: 16px; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
a { color: var(--teal); }

/* shell */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.rail { background: var(--teal-ink); color: #DCEBEC; padding: 22px 14px 18px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.brand { font-family: var(--serif); font-size: 18px; color: #fff; line-height: 1.25; padding: 0 8px; }
.brand small { display: block; font-family: var(--sans); font-size: 12px; color: #9EC3C7; margin-top: 4px; }
.rail .client { padding: 10px 8px; border-top: 1px solid #1F6670; border-bottom: 1px solid #1F6670; }
.rail .client b { color: #fff; display: block; font-weight: 600; }
.rail .client button { background: none; border: 0; color: #9EC3C7; padding: 0; cursor: pointer; font-size: 12.5px; margin-top: 4px; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li { margin: 1px 0; }
.steps button { width: 100%; text-align: left; background: none; border: 0; color: #DCEBEC; padding: 8px 8px 8px 36px; border-radius: var(--r); cursor: pointer; position: relative; }
.steps li.num button::before { counter-increment: s; content: counter(s); position: absolute; left: 8px; top: 7px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid #4E8C93; font-size: 11.5px; display: grid; place-items: center; color: #BFD9DB; }
.steps button:hover { background: #135560; }
.steps button[aria-current="page"] { background: #F3F6F6; color: var(--teal-ink); font-weight: 600; }
.steps button[aria-current="page"]::before { border-color: var(--teal); color: var(--teal); }
.steps .dot { position: absolute; right: 8px; top: 13px; width: 8px; height: 8px; border-radius: 50%; }
.rail .foot { margin-top: auto; font-size: 12px; color: #9EC3C7; padding: 0 8px; }
.rail .foot button { display: block; background: none; border: 0; color: #DCEBEC; padding: 5px 0; cursor: pointer; text-align: left; }
.main { min-width: 0; padding: 26px 32px 60px; }
.pagehead { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.pagehead .lead { flex: 1 1 380px; }
.pagehead p { color: var(--muted); max-width: 72ch; margin-top: 6px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* controls */
.btn { border: 1px solid var(--rule); background: var(--surface); padding: 7px 13px; border-radius: var(--r); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: #AEBCC1; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.primary:hover { background: var(--teal-ink); }
.btn.ghost { background: none; border-color: transparent; color: var(--teal); }
.btn.danger { color: var(--crit); }
label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
label.f > span { color: var(--muted); }
.inp, select.inp, textarea.inp { border: 1px solid var(--rule); background: var(--in-bg); color: var(--in-ink); border-radius: 4px; padding: 6px 8px; width: 100%; }
textarea.inp { min-height: 110px; resize: vertical; line-height: 1.5; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px 16px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 18px 20px; margin-bottom: 16px; }
.panel > h2 { margin-bottom: 12px; }
.panel .hint { color: var(--muted); font-size: 12.5px; margin: -6px 0 12px; max-width: 80ch; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--teal); color: #fff; }

/* data tables */
.tablewrap { overflow: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); max-height: calc(100vh - 210px); }
table.data { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
table.data th, table.data td { padding: 5px 10px; border-bottom: 1px solid var(--rule-soft); text-align: right; white-space: nowrap; }
table.data thead th { position: sticky; top: 0; background: #E9EFF0; z-index: 2; font-weight: 600; color: var(--teal-ink); border-bottom: 1px solid var(--rule); }
table.data th.lab, table.data td.lab { text-align: left; white-space: normal; position: sticky; left: 0; background: inherit; z-index: 1; min-width: 300px; max-width: 460px; }
table.data tbody tr { background: var(--surface); }
table.data thead th.lab { z-index: 3; }
table.data tr.sec td { background: var(--teal-soft); color: var(--teal-ink); font-weight: 600; text-align: left; font-size: 12.5px; padding-top: 9px; }
table.data tr.calc { background: var(--calc-bg); }
table.data tr.calc td.lab { font-weight: 600; }
table.data tr.sub td.lab { padding-left: 26px; color: #34464F; }
table.data td.cell { padding: 0; }
table.data td.cell input { width: 100%; min-width: 108px; border: 0; background: var(--in-bg); color: var(--in-ink); text-align: right; padding: 5px 10px; border-left: 1px solid #F4E7B0; }
table.data td.cell input:focus { background: #fff; outline: 2px solid var(--teal); outline-offset: -2px; }
table.data td.cell.opt input { background: #FFFBEA; }
table.data td.cell input.imp { box-shadow: inset 3px 0 0 #8BB8BE; }
table.data .neg { color: var(--crit); }
.pertitle { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); }

/* status */
.st { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.st.ok { background: var(--ok-bg); color: var(--ok); }
.st.chk { background: var(--chk-bg); color: var(--chk); }
.st.risk { background: var(--risk-bg); color: var(--risk); }
.st.crit { background: var(--crit-bg); color: var(--crit); }
.st.nd { background: var(--nd-bg); color: var(--nd); }

/* ratio map: the signature element */
table.rmap td.v { position: relative; min-width: 104px; }
table.rmap td.v span.val { position: relative; z-index: 1; }
table.rmap td.v.ok { background: var(--ok-bg); color: var(--ok); }
table.rmap td.v.chk { background: var(--chk-bg); color: var(--chk); }
table.rmap td.v.risk { background: var(--risk-bg); color: var(--risk); }
table.rmap td.v.crit { background: var(--crit-bg); color: var(--crit); font-weight: 600; }
table.rmap td.v.nd { color: var(--nd); }
table.rmap td.trend { width: 92px; padding: 2px 8px; }
table.rmap td.lab .formula { display: block; font-size: 12px; color: var(--muted); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: 10px 2px 0; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); margin-bottom: 16px; }
.facts div { padding: 12px 16px; border-right: 1px solid var(--rule-soft); }
.facts div:last-child { border-right: 0; }
.facts b { display: block; font-size: 19px; font-family: var(--serif); font-weight: 600; margin-top: 2px; }
.facts span { color: var(--muted); font-size: 12.5px; }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; border-bottom: 1px solid var(--rule); }
.tabs button { border: 0; background: none; padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); }
.tabs button[aria-selected="true"] { border-bottom-color: var(--teal); color: var(--ink); font-weight: 600; }

/* client list */
.clients { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.clients th, .clients td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--rule-soft); }
.clients th { background: #E9EFF0; color: var(--teal-ink); font-weight: 600; font-size: 13px; }
.clients td:last-child { text-align: right; white-space: nowrap; }
.empty { border: 1px dashed #AFC0C4; border-radius: 10px; padding: 34px; text-align: center; background: var(--surface); }
.empty h2 { margin-bottom: 6px; }

/* dialog */
dialog { border: 0; border-radius: 10px; padding: 0; width: min(680px, 94vw); box-shadow: 0 18px 60px rgba(10, 40, 46, .28); color: var(--ink); }
dialog::backdrop { background: rgba(14, 40, 46, .45); }
dialog .dh { padding: 18px 22px 6px; }
dialog .db { padding: 8px 22px 16px; max-height: 64vh; overflow: auto; }
dialog .df { padding: 12px 22px 18px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--rule-soft); }
.logline { padding: 6px 0; border-bottom: 1px solid var(--rule-soft); font-size: 13px; }
.drop { border: 2px dashed #AFC0C4; border-radius: 8px; padding: 18px; text-align: center; color: var(--muted); background: #FAFCFC; }
.drop.over { border-color: var(--teal); background: var(--teal-soft); }

.toast { position: fixed; bottom: 18px; right: 18px; background: var(--teal-ink); color: #fff; padding: 10px 16px; border-radius: 8px; box-shadow: 0 8px 26px rgba(0,0,0,.2); opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; z-index: 50; }
.toast.on { opacity: 1; transform: none; }
.saved { font-size: 12.5px; color: var(--muted); }
.concl-text { white-space: pre-wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; }
  .main { padding: 18px 16px 40px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  .rail, .toolbar, .noprint { display: none !important; }
  .app { display: block; }
  .main { padding: 0; }
  body { background: #fff; }
  .panel, .tablewrap { border: 0; max-height: none; overflow: visible; }
}
h1, h2, h3, .brand, .facts b { word-spacing: -0.14em; }
table.form th.lab, table.form td.lab { min-width: 56px; width: 56px; }
table.form td { text-align: left; padding: 6px 6px; }
table.form td .inp { min-width: 120px; }
table.form td input[data-f="name"], table.form td input[data-f="label"] { min-width: 230px; }
table.form td select[data-f="role"], table.form td select[data-f="regime"] { min-width: 170px; }
table.chk th:not(.lab), table.chk td:not(.lab) { width: 132px; text-align: center; }
.brand small { word-spacing: normal; }

/* ================= фирменный стиль: белый 70 · лазурно-синий 10 · лайм 10 · графит 5 · платина 5 ================= */
:root {
  --blue: #023DFF; --blue-ink: #0231CC; --blue-soft: #EEF2FF; --lime: #00BB00; --lime-ink: #067A06; --lime-soft: #E6F7E6;
  --graphite: #272727; --platinum: #E5E4E2; --white: #FFFFFF;
  --paper: #FFFFFF; --surface: #FFFFFF; --ink: #272727; --muted: #666666; --rule: #E5E4E2; --rule-soft: #EFEEEC;
  --teal: #023DFF; --teal-ink: #272727; --teal-soft: #F2F2F0;
  --in-bg: #EEF2FF; --in-ink: #0231CC; --calc-bg: #F6F6F5;
  --ok: #067A06; --ok-bg: #E6F7E6;
  --serif: "Futura PT", "Futura", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif;
  --sans: "Roboto", "Segoe UI", system-ui, Arial, sans-serif;
  --note: Verdana, Geneva, "DejaVu Sans", sans-serif;
  --shape: 22px 22px 22px 0;
}
h1, h2, h3, .brand, .facts b { font-family: var(--serif); font-weight: 600; letter-spacing: 0; word-spacing: normal; }
h1 { font-size: 28px; }
/* системные уточнения — Verdana */
.pagehead p, .panel .hint, .muted, .small, .pertitle, .saved, .legend, table.rmap td.lab .formula, label.f > span, .facts span, .brand small, .logline .small {
  font-family: var(--note); font-size: 11.5px; letter-spacing: 0; }
.pagehead p { font-size: 12.5px; line-height: 1.6; }

/* навигация: лазурно-синяя панель, лайм — текущий шаг */
.rail { background: var(--blue); color: #fff; }
.brand { color: #fff; } .brand small { color: #D6DFFF; }
.rail .client { border-color: rgba(255,255,255,.28); }
.rail .client button, .rail .foot, .rail .foot .saved { color: #D6DFFF; }
.steps button { color: #fff; }
.steps li.num button::before { border-color: rgba(255,255,255,.55); color: #fff; }
.steps button:hover { background: rgba(255,255,255,.12); }
.steps button[aria-current="page"] { background: #fff; color: var(--graphite); }
.steps button[aria-current="page"]::before { background: var(--lime); border-color: var(--lime); color: #fff; }
.steps .dot { box-shadow: 0 0 0 2px var(--blue); }
.rail .foot button { color: #fff; }

/* кнопки: синий — основное действие, графит — обводка */
.btn { border-color: var(--platinum); border-radius: 999px; padding: 7px 16px; }
.btn:hover { border-color: var(--graphite); }
.btn.primary { background: var(--blue); border-color: var(--blue); }
.btn.primary:hover { background: var(--blue-ink); }
.btn.ghost { color: var(--blue); }
.seg { border-radius: 999px; border-color: var(--platinum); }
.seg button[aria-pressed="true"] { background: var(--graphite); color: #fff; }
.tabs { border-bottom-color: var(--platinum); }
.tabs button[aria-selected="true"] { border-bottom: 3px solid var(--lime); color: var(--graphite); }

/* поверхности: фирменная форма — три скругления, один прямой угол */
.panel, .facts, .tablewrap, .empty, .clients { border-radius: var(--shape); border-color: var(--platinum); }
.facts { background: var(--white); border: 0; box-shadow: inset 0 0 0 1px var(--platinum); }
.facts div { border-right-color: var(--platinum); }
.facts div:first-child { background: var(--graphite); color: #fff; border-radius: 22px 0 0 0; }
.facts div:first-child span { color: #CFCFCF; }
.empty { border-style: solid; }

/* таблицы: шапка платиновая, разделы — тонкая лаймовая метка */
table.data thead th, .clients th { background: var(--platinum); color: var(--graphite); border-bottom-color: #D2D1CE; }
table.data tr.sec td { background: #fff; color: var(--graphite); border-bottom: 1px solid var(--platinum); box-shadow: inset 4px 0 0 var(--lime); text-transform: none; }
table.data td.cell input { border-left-color: #DCE4FF; }
table.data td.cell.opt input { background: #F6F8FF; }
table.data td.cell input.imp { box-shadow: inset 3px 0 0 var(--lime); }
.inp, select.inp, textarea.inp { border-color: #D6DEFF; }
:focus-visible { outline-color: var(--blue); }
table.data td.cell input:focus { outline-color: var(--blue); }

/* оценки: «норма» — лайм; остальные — функциональные цвета вне палитры (нужны для смысла) */
.st.ok { background: var(--lime-soft); color: var(--lime-ink); }
table.rmap td.v.ok { background: var(--lime-soft); color: var(--lime-ink); }
.drop { border-color: var(--platinum); background: #fff; border-radius: var(--shape); }
.drop.over { border-color: var(--blue); background: var(--blue-soft); }
.toast { background: var(--graphite); }
dialog { border-radius: var(--shape); }
.brand small { font-weight: 400; }
.app { grid-template-columns: 224px 1fr; }

/* проблемы и решения */
.pdot { position: absolute; right: 8px; top: 8px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 11.5px; font-weight: 700; display: none; place-items: center; line-height: 20px; text-align: center; }
.pdot.crit, .pdot.risk, .pdot.chk { display: inline-block; }
.pdot.crit { background: #FF4D4F; color: #fff; } .pdot.risk { background: #FFB020; color: #272727; } .pdot.chk { background: #fff; color: var(--blue); }
.steps button[aria-current="page"] .pdot.chk { background: var(--blue-soft); }
.probs { border: 1px solid var(--platinum); border-radius: var(--shape); padding: 12px 16px; margin-bottom: 14px; background: #fff; box-shadow: inset 4px 0 0 #FFB020; }
.probs-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.prob { display: grid; grid-template-columns: 112px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule-soft); align-items: start; }
.prob:first-of-type { border-top: 0; }
.prob .st { justify-self: start; }
.prob .fix { margin: 4px 0 0; color: #3A3A3A; font-size: 13px; }
.prob .fix::before { content: "Что сделать: "; font-weight: 600; color: var(--blue); }
.st.nd { background: var(--nd-bg); }
table.data td.cell input.bad { outline: 2px solid #FFB020; outline-offset: -2px; background: #FFF6E5; }
table.data td.cell input.bad-crit { outline-color: #FF4D4F; background: #FFEDED; }
table.data td.bad { box-shadow: inset 0 0 0 2px #FFB020; background: #FFF6E5; }
table.data td.bad-crit { box-shadow: inset 0 0 0 2px #FF4D4F; background: #FFEDED; }
table.data .code { display: inline-block; min-width: 34px; color: var(--blue); font-family: var(--note); font-size: 11px; }
table.data tr.sub td.lab { padding-left: 22px; }
/* прогноз */
.fcgrid { display: grid; grid-template-columns: minmax(380px, 1.1fr) 1fr; gap: 22px; align-items: start; }
.fcgrid h3, .panel h3 { font-size: 15px; margin-bottom: 8px; }
table.data.fc td.cell input, .inp.num { text-align: right; }
.inp.num.inl { width: 80px; display: inline-block; padding: 3px 6px; }
.grid2.tight { grid-template-columns: repeat(2, minmax(150px, 1fr)); gap: 10px 14px; }
.seas { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.seas .inp { padding: 5px 6px; }
.fcres { display: grid; grid-template-columns: minmax(420px, 1fr) minmax(360px, 1fr); gap: 22px; align-items: start; }
.chart { width: 100%; height: auto; }
.chart text { font-family: var(--note); font-size: 10px; fill: #666; }
.chart .grid { stroke: #EFEEEC; } .chart .zero { stroke: #272727; stroke-width: .8; }
.chart .buf { stroke: #FFB020; stroke-dasharray: 5 4; stroke-width: 1.4; }
.chart .b { fill: none; stroke: var(--blue); stroke-width: 2.4; } .chart .s { fill: none; stroke: var(--lime); stroke-width: 2.4; }
.legend .ln { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; }
.legend .ln.b { background: var(--blue); } .legend .ln.s { background: var(--lime); } .legend .ln.buf { background: #FFB020; }
table.data td.low { background: #FFF6E5; color: #9A5B00; font-weight: 600; }
@media (max-width: 1100px) { .fcgrid, .fcres { grid-template-columns: 1fr; } }
.rail .back { background: #fff; color: var(--blue); border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 600; cursor: pointer; text-align: left; }
.rail .back:hover { background: var(--lime); color: #fff; }
.copy { font-family: var(--note); font-size: 11px; color: #D6DFFF; margin: 10px 0 0; }
.main > .copy, body > .main .copy { color: #888; }
table.oked td:nth-child(3) .inp { min-width: 380px; }
table.oked td:nth-child(3) .small { display: block; margin-top: 3px; }
table.data th.yr { background: #D9D8D5; }
table.data td.yr { background: #F6F6F5; font-weight: 600; border-left: 1px solid #E5E4E2; }
table.data tr.calc td.yr { background: #EDEDEB; }

/* ================= главная: список клиентов ================= */
.home { max-width: 1180px; margin: 0 auto; padding: 22px 32px 30px; }
.hbar { display: flex; align-items: center; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--platinum); }
.hbar b { font-family: var(--serif); font-size: 19px; font-weight: 600; }
.hbar .hnote { margin-left: auto; font-family: var(--note); font-size: 11px; color: #777; }
.mark { width: 30px; height: 30px; background: var(--blue); border-radius: 10px 10px 10px 0; position: relative; }

  if (!C.decl.length && !C.bank.length) return;
  for (let k = 1; k <= nComp(); k++) for (const p of C.periods) for (const c of taxChecks(k, p)) {
    const where = `${compName(k)}, ${p.label}`;
    if (c.st === "chk" || c.st === "risk") {
      const det = c.share ? `чистые кредитовые обороты ${fmt(c.b)} — ${pctFmt(c.rel)} от выручки с НДС ${fmt(c.a)}` : `${c.aLab}: ${fmt(c.a)}; ${c.bLab}: ${fmt(c.b)}; разница ${fmt(c.diff)} (${pctFmt(c.rel)})`;
      add(c.st, c.grp, `${where}: ${c.title.toLowerCase()} — расхождение`, det, c.fix, c.cells);
    } else if (c.st === "nd" && c.cov < c.need && c.cov > 0) add("nd", c.grp, `${where}: ${c.title.toLowerCase()} — данные не за весь период`, `загружено ${c.cov} из ${c.need} мес.`, c.grp === "bank" ? "Загрузите выписки или справки за остальные месяцы периода — тогда сверка выполнится." : "Загрузите декларации за остальные части периода — тогда сверка выполнится.");
    if (c.nofx && c.id === "bank_rev") add("chk", "bank", `${where}: нет курса НБ РК для ${c.nofx} операций в валюте`, "", "Укажите курсы на странице «Банк» (блок «Курсы НБ РК») или загрузите их файлом — тогда валютные поступления войдут в обороты.");
  }
}
function checksTable(k, ids, emptyText) {
  const pers = C.periods, checks = pers.map(p => taxChecks(k, p).filter(c => ids.includes(c.id)));
  const have = ids.filter(id => checks.some(cs => cs.some(c => c.id === id)));
  if (!have.length) return `<p class="muted">${emptyText}</p>`;
  let h = `<div class="tablewrap" style="max-height:none"><table class="data rmap tax"><thead><tr><th class="lab">Показатель</th>${pers.map(p => `<th>${esc(p.label)}</th>`).join("")}</tr></thead><tbody>`;
  for (const id of have) {
    const row = () => checks.map(cs => cs.find(c => c.id === id));
    const any = row().find(Boolean);
    h += `<tr class="sec"><td class="lab" colspan="${pers.length + 1}">${esc(any.title)}</td></tr>`;
    h += `<tr><td class="lab">${esc(any.aLab)}</td>${row().map(c => `<td>${c ? fmt(c.a) : ""}</td>`).join("")}</tr>`;
    h += `<tr><td class="lab">${esc(any.bLab)}</td>${row().map(c => `<td>${c ? fmt(c.b) + (c.cov < c.need ? `<span class="pertitle">${c.cov} из ${c.need} мес.</span>` : "") + (c.nofx ? `<span class="pertitle">без курса: ${c.nofx} оп.</span>` : "") : ""}</td>`).join("")}</tr>`;
    h += `<tr><td class="lab">${any.share ? "Доля чистых оборотов в выручке с НДС" : "Расхождение (разница, %)"}</td>${row().map(c => {
      if (!c) return "<td></td>";
      if (c.st === "nd") return `<td class="v nd"><span class="val">${c.cov < c.need ? "неполный период" : c.nofx ? "нет курса" : "нет данных"}</span></td>`;

      return `<td class="v ${c.st}" title="${esc(c.st === "ok" ? "В допуске" : c.fix)}"><span class="val">${txt}</span></td>`;

}

/* ---------- загрузка документов */
function compByBin(bin) {
  if (!bin) return 0;
  const i = C.companies.findIndex(x => String(x.bin || "").replace(/\D/g, "") === bin);
  if (i >= 0) return i + 1;
  return String(C.card.bin || "").replace(/\D/g, "") === bin ? 1 : 0;
}
async function readDoc(file) {
  if (/\.pdf$/i.test(file.name)) {
    const r = await DocParse.read(await file.arrayBuffer());
    if (r.pdf.noText) throw new Error("в PDF нет текста — это скан или картинка. Введите суммы вручную");
    return r;
  }
  if (/\.(xlsx|xlsm|xls)$/i.test(file.name)) return DocParse.readSheets(await readWorkbook(await file.arrayBuffer()));
  if (/\.csv$/i.test(file.name)) return DocParse.readSheets(csvSheets(await file.arrayBuffer()));
  if (/\.(html?|mht)$/i.test(file.name)) { const pdf = htmlToLines(await file.arrayBuffer()); if (!pdf.pages[0].lines.length) throw new Error("в HTML-файле нет текста"); return DocParse.readLines(pdf); }
  throw new Error("поддерживаются PDF, HTML, Excel (.xlsx, .xlsm, .xls) и CSV");
}
async function importDocs(files, kDef, mode) {
  ensureDocs();

    let r;
    try { toast("Читаю " + file.name + "…"); r = await readDoc(file); }
    catch (e) { rep.push({ file: file.name, err: /паролем/.test(e.message) ? e.message + " — снимите пароль или введите суммы вручную" : e.message }); continue; }
    let kind = r.kind;
    if (!kind) {
      kind = await dialog("Что это за документ?", `<p>Не удалось уверенно определить тип документа <b>${esc(file.name)}</b>.</p>`, [{ t: "Пропустить", v: null }, { t: "Кредитный отчёт", v: "credit" }, { t: "Справка об оборотах", v: "bank" }, { t: "Выписка по счёту", v: "stmt" }, { t: "Декларация", primary: mode === "tax", v: "decl" }]);
      if (!kind) { rep.push({ file: file.name, err: "пропущено" }); continue; }
      if (kind === "decl") r.decl = DocParse.parseDecl(r.pdf); else if (kind === "credit") r.credit = DocParse.parseCredit(r.pdf); else if (kind === "stmt") r.stmt = DocParse.parseStmt(r.pdf); else r.bank = DocParse.parseBank(r.pdf);
    }
    if (kind === "credit") {
      const cr = r.credit;
      if (!cr.loans.length) { rep.push({ file: file.name, err: "в отчёте не найдено договоров (нужны поля «Кредитор», «Сумма», «Остаток»…). Добавьте кредиты вручную" }); continue; }
      const n = await creditImport(cr, compByBin(cr.bin) || kDef, file.name);
      rep.push(n ? { file: file.name, page: "credit", ok: `${cr.bureau}: договоров ${n}` } : { file: file.name, err: "не сохранено" });
      continue;
    }
    if (kind === "decl") {
      const d = r.decl, keys = DocParse.pickKeys(d, DMAP), vals = {};
      for (const [key, code] of Object.entries(keys)) { const l = d.lines.find(x => x.code === code); if (l && l.vals.length) vals[key] = l.vals[0]; }
      const doc = { id: uid(), k: compByBin(d.bin) || kDef, file: file.name, form: d.form, formName: d.formName, year: d.year, part: d.part, bin: d.bin, lines: d.lines, vals, src: keys, t: Date.now() };
      const saved = await declEditor(doc, true, d.bin && compByBin(d.bin) ? "Компания определена по БИН " + d.bin : "");
      rep.push(saved ? { file: file.name, page: "tax", ok: `${saved.formName}, ${saved.year}, ${PARTS[saved.part]}: строк ${d.lines.length}` } : { file: file.name, err: "не сохранено" });
    } else if (kind === "stmt") {

  B.querySelectorAll("[data-bm]").forEach(inp => {
    const old = inp.dataset.bm, m = inp.value || old;
    const o0 = doc.months?.[old] || {}, keep = (sel, v0) => { const x = B.querySelector(sel).value; return x === K1(v0) ? v0 : fromK(x); };  // без правки — точная сумма из документа
    const cr = keep(`[data-bcr="${old}"]`, o0.cr), db = keep(`[data-bdb="${old}"]`, o0.db);
    if (/^\d{4}-\d{2}$/.test(m)) months[m] = { cr: N(cr) + N(months[m]?.cr), db: N(db) + N(months[m]?.db) };
  });
  return months;
}

/* ---------- HTML (например, кредитный отчёт ПКБ): строки таблиц и абзацы → те же «строки с ячейками», что и для PDF */
function htmlToLines(buf) {
  const u8 = new Uint8Array(buf);
  let head = new TextDecoder("latin1").decode(u8.subarray(0, 4096)), cs = (/charset\s*=\s*["']?([\w-]+)/i.exec(head) || [])[1] || "utf-8";
  if (u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) cs = "utf-8";
  let text; try { text = new TextDecoder(cs).decode(u8); } catch (e) { text = new TextDecoder("utf-8").decode(u8); }
  if (/utf-?8/i.test(cs) && text.includes("\uFFFD")) text = new TextDecoder("windows-1251").decode(u8);
  const doc = new DOMParser().parseFromString(text, "text/html");   // документ инертен: скрипты и картинки не запускаются и не грузятся
  doc.querySelectorAll("script,style,noscript,template").forEach(e => e.remove());
  const clean = s => String(s || "").replace(/[\u00A0\s]+/g, " ").trim();
  const lines = []; let y = 0;
  const push = cells => { const cs2 = cells.filter(c => c.s); if (!cs2.length) return; lines.push({ y: -(y += 12), fs: 10, cells: cs2, text: cs2.map(c => c.s).join("  "), page: 0 }); };
  const BLOCK = /^(P|DIV|H[1-6]|LI|SPAN|B|STRONG|TD|TH|LABEL|DT|DD|CAPTION)$/;
  const walk = el => {
    for (const ch of el.children) {
      if (ch.tagName === "TABLE") { for (const tr of ch.querySelectorAll(":scope > tr, :scope > thead > tr, :scope > tbody > tr, :scope > tfoot > tr")) row(tr); continue; }
      if (ch.querySelector("br") && !ch.querySelector("table, p, div, li")) { for (const part of ch.innerHTML.split(/<br\s*\/?>/i)) { const d = doc.createElement("div"); d.innerHTML = part; const t = clean(d.textContent); if (t) push([{ x: 0, x2: 90, s: t, fs: 10 }]); } continue; }
      if (ch.querySelector("table, p, div, li, h1, h2, h3, h4, h5, h6") && !/^(SPAN|B|STRONG)$/.test(ch.tagName)) { walk(ch); continue; }
      if (BLOCK.test(ch.tagName) || ch.children.length === 0) { const t = clean(ch.textContent); if (t) push([{ x: 0, x2: 90, s: t, fs: 10 }]); }
      else walk(ch);
    }
  };
  const row = tr => {
    const cells = []; let col = 0; const nested = [];
    for (const td of tr.children) {
      if (!/^(TD|TH)$/.test(td.tagName)) continue;
      const span = Math.max(1, +td.getAttribute("colspan") || 1);
      const inner = td.querySelector("table");
      if (inner) nested.push(td);
      else cells.push({ x: col * 100, x2: col * 100 + 90, s: clean(td.innerText !== undefined && td.innerText ? td.innerText : td.textContent), fs: 10 });
      col += span;
    }
    push(cells);
    for (const td of nested) walk(td);
  };
  walk(doc.body || doc.documentElement);
  return { pages: [{ lines }], noText: !lines.length };
}

"use strict";
/* ---------------------------------------------------------------- «Кредиты и залог»: кредитные отчёты, реестр займов, залоги, гаранты.
   Плюс аналитика выписок для «Банка»: покупатели, списания по видам, сезонность. Суммы документов — в тенге, на экране — тыс. тг. */
function ensureCredit(c = C) { if (!c) return; c.cr = c.cr || []; c.coll = c.coll || []; c.guar = c.guar || []; }
const COLL_TYPES = { "Недвижимость": 0.3, "Земельный участок": 0.4, "Транспорт": 0.4, "Спецтехника и оборудование": 0.5, "Товары в обороте (ТМЗ)": 0.5, "Деньги на депозите": 0, "Права требования": 0.5, "Гарантия банка": 0, "Прочее": 0.5 };
const isoToday = () => new Date().toISOString().slice(0, 10);
function monthsLeft(end, from) {
  if (!end) return null;
  const a = new Date((from || C.card.date || isoToday()) + "T00:00:00Z"), b = new Date(end + "T00:00:00Z");
  if (isNaN(a) || isNaN(b)) return null;
  return Math.max(0, (b.getUTCFullYear() - a.getUTCFullYear()) * 12 + b.getUTCMonth() - a.getUTCMonth() + (b.getUTCDate() >= a.getUTCDate() ? 0 : -1) + 1);
}
const crKzt = x => (x.cur && x.cur !== "KZT" ? (fxRate(x.cur, isoToday().slice(0, 7)) || fxRate(x.cur, isoToday()) || null) : 1);
const isGuar = x => /гарант|поручит|залогодат/i.test(x.role || "") || /гаранти/i.test(x.type || "");
function crSummary(k) {
  ensureCredit();
  const act = C.cr.filter(x => x.k === k && x.status !== "closed"), own = act.filter(x => !isGuar(x)), gu = act.filter(isGuar);
  let debt = 0, pay = 0, nofx = 0; for (const x of own) { const r = crKzt(x); if (r === null) { nofx++; continue; } debt += N(x.bal) * r; pay += N(x.pay) * r; }
  const guarAmt = gu.reduce((a, x) => a + N(x.bal) * (crKzt(x) || 0), 0);
  const od = Math.max(0, ...act.map(x => N(x.odDays))), maxOd = Math.max(0, ...C.cr.filter(x => x.k === k).map(x => Math.max(N(x.maxOd), N(x.odDays))));
  return { n: own.length, debt: debt / 1000, pay: pay / 1000, guar: guarAmt / 1000, od, maxOd, nofx, any: C.cr.some(x => x.k === k) };
}
function creditChecks(k) {
  const s = crSummary(k); if (!s.any) return [];
  const L = lastPid(), out = [], bd = L ? ratio(k, "debt", L) : null;
  if (isNum(bd)) {
    const diff = s.debt - bd, rel = Math.abs(diff) / Math.max(Math.abs(bd), Math.abs(s.debt), 1);
    out.push({ id: "debt", title: "Долг по кредитному отчёту и по балансу", st: Math.abs(diff) <= (N(C.card.tol) || 1) || rel <= 0.1 ? "ok" : rel > 0.3 ? "risk" : "chk", a: bd, b: s.debt, diff, rel,
      det: `баланс (${C.periods[perIdx(L)].label}) ${fmt(bd)}, кредитный отчёт ${fmt(s.debt)}, разница ${fmt(diff)} (${pctFmt(rel)})`,
      fix: "Даты разные: баланс — на отчётную дату, кредитный отчёт — на дату формирования. Если разница большая — проверьте, все ли займы отражены в балансе (в т.ч. от участников и нефинансовых организаций), и запросите расшифровку займов.", cells: [{ k, key: "stloan", pid: L }, { k, key: "ltloan", pid: L }] });
  }
  if (s.od > 0) out.push({ id: "od", title: "Текущая просрочка по кредитам", st: s.od > 30 ? "crit" : "risk", det: `${s.od} дн.`, fix: "Выясните причину просрочки и срок погашения; запросите справку банка об отсутствии просрочки на дату решения. Текущая просрочка — как правило, стоп-фактор." });
  else if (s.maxOd > 30) out.push({ id: "maxod", title: "Просрочки в кредитной истории", st: "chk", det: `максимум ${s.maxOd} дн.`, fix: "Уточните период и причину просрочки; отразите в заключении, была ли она урегулирована." });
  if (s.guar > 0) out.push({ id: "guar", title: "Обязательства компании как гаранта", st: "chk", det: `${fmt(s.guar)} тыс. тг`, fix: "Учитывайте условные обязательства: оцените финансовое положение должников, за которых выдана гарантия." });
  return out;
}
function creditProblems(add) {
  if (!C) return; ensureCredit();
  for (let k = 1; k <= nComp(); k++) for (const c of creditChecks(k)) if (c.st !== "ok") add(c.st, "credit", `${compName(k)}: ${c.title.toLowerCase()}`, c.det, c.fix, c.cells || []);
  const cv = collCover();
  if (cv && isNum(cv.cover) && cv.cover < 1.2) add(cv.cover < 1 ? "risk" : "chk", "coll", `Обеспечение покрывает запрашиваемую сумму на ${pctFmt(cv.cover)}`, `залоговая стоимость ${fmt(cv.coll)}, запрос ${fmt(cv.amt)} тыс. тг`, "Добавьте обеспечение, уменьшите сумму или учтите гарантию фонда (например, «Даму»).");
  // концентрация покупателей
  for (let k = 1; k <= nComp(); k++) { const t = topBuyers(k); if (t && t.top1 > 0.3) add(t.top1 > 0.5 ? "risk" : "chk", "bank", `${compName(k)}: высокая зависимость от покупателя`, `${t.rows[0].name} — ${pctFmt(t.top1)} чистых поступлений (${t.label})`, "Оцените устойчивость отношений с покупателем (договор, срок, история), диверсификацию и влияние его ухода на денежный поток; учтите в стресс-сценарии."); }
}

/* ---------- залог */
function collCover() {
  ensureCredit();
  const amt = N(C.card.amount); if (!C.coll.length) return null;
  const mk = C.coll.reduce((a, x) => a + N(x.market), 0), coll = C.coll.reduce((a, x) => a + N(x.market) * (1 - N(x.disc)), 0);
  return { mk, coll, amt, cover: amt > 0 ? coll / amt : null, ltv: coll > 0 && amt > 0 ? amt / coll : null };
}

function creditToForecast() {
  ensureCredit();
  const ks = C.obj > 0 ? [C.obj] : C.companies.map((_, i) => i + 1);

  for (const x of C.cr) {

    const r = crKzt(x); if (r === null || !N(x.bal)) continue;
    loans.push({ name: `${x.creditor || "кредит"}${ks.length > 1 ? " (" + compName(x.k) + ")" : ""}`, bal: Math.round(N(x.bal) * r / 100) / 10, rate: isNum(x.rate) ? x.rate : f.aggRate, rem: Math.max(1, monthsLeft(x.end) || f.aggTerm), scheme: x.scheme || "Дифференцированный", grace: 0 });

function stmtTx(k) {   // все операции выписок компании в тенге, без повторов по счёту и месяцу
  const out = [], seen = new Set(), own = ownOf(k);
  for (const b of C.bank.filter(b => b.k === k && b.kind === "stmt").sort((a, c) => N(c.t) - N(a.t))) {
    const acc = b.acc || "?", mine = new Set((b.txs || []).map(t => t.d.slice(0, 7)).filter(m => !(b.acc && seen.has(acc + "|" + m))));
    (b.txs || []).forEach((t, i) => {
      const m = t.d.slice(0, 7); if (!mine.has(m)) return;
      const cr = t.cr ? txKzt(b, t, t.cr) : 0, db = t.db ? txKzt(b, t, t.db) : 0;
      out.push({ t, m, cr: N(cr), db: N(db), cat: t.cr ? txCat(b, i, t, own)[0] : null, dcat: t.db ? DocParse.classifyDebit(t, own) : null });
    });

}

}

// сезонность выручки по чистым кредитовым оборотам (среднее по годам, среднее = 1)
function bankSeasonality() {
  const ks = C.obj > 0 ? [C.obj] : C.companies.map((_, i) => i + 1), byM = {};
  for (const k of ks) for (const [m, o] of Object.entries(bankMonths(k))) byM[m] = (byM[m] || 0) + o.net;
  const ms = Object.keys(byM).filter(m => byM[m] > 0).sort();
  if (ms.length < 12) return null;
  const last = ms.slice(-24), acc = new Array(12).fill(0), cnt = new Array(12).fill(0);
  for (const m of last) { const i = +m.slice(5, 7) - 1; acc[i] += byM[m]; cnt[i]++; }
  if (cnt.some(c => !c)) return null;
  const avg = acc.map((v, i) => v / cnt[i]), mean = avg.reduce((a, b) => a + b, 0) / 12;
  return avg.map(v => Math.round(v / mean * 100) / 100);
}

async function svgPng(svg) {
  const src = svg.replace(/<svg([^>]*)>/, `<svg$1><style>${CHART_CSS}</style>`);
  const url = URL.createObjectURL(new Blob([src], { type: "image/svg+xml" }));
  try {
    const im = new Image(); im.src = url; await im.decode();
    const cv = document.createElement("canvas"); cv.width = im.naturalWidth * 2 || 1040; cv.height = im.naturalHeight * 2 || 460;
    const g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(im, 0, 0, cv.width, cv.height);
    return cv.toDataURL("image/png").split(",")[1];
  } finally { URL.revokeObjectURL(url); }
}

  ["terror", "Перечни лиц, связанных с терроризмом и экстремизмом, санкции", "crit", /(террор|экстремизм|санкционн|санкци)/],

  ["pension", "Задолженность по пенсионным и социальным отчислениям", "risk", /((опв|пенсион|социальн\S*\s+отчислен|осмс)\S*.{0,30}задолж|задолж\S*.{0,30}(опв|пенсион|социальн|осмс))/],
  ["violator", "Нарушитель налогового законодательства", "risk", /(нарушени\S*\s+налогов|нарушител\S*\s+налогов)/],
  ["address", "Отсутствие по юридическому адресу", "risk", /(отсутству\S*\s+по\s+(юридическ|месту\s+нахожд)|не\s+находит\S*\s+по\s+(юридическ|месту))/],
  ["erd", "Должник по исполнительным производствам (ЕРД)", "risk", /(исполнительн\S*\s+производ|реестр\S*\s+должник|(?:^|[^а-яё])ерд(?![а-яё]))/],

  ["courts", "Судебные дела в качестве ответчика", "chk", /(судебн\S*\s+(дел|спор|акт|разбират)|ответчик|арбитраж)/],

const TST = { na: "не проверено", no: "нет", yes: "есть" };
function ensureTrust(c = C) { if (!c) return; c.trust = c.trust || {}; for (let k = 1; k <= c.companies.length; k++) { const t = c.trust[k] || (c.trust[k] = { items: {}, src: [] }); for (const [id] of TRUST) t.items[id] = t.items[id] || { st: "na", note: "" }; } }
const NEG = /(не\s+(числит|значит|найден|обнаруж|является|включ|состоит|выявлен|имеет|зарегистр|установлен|привлекал|участвует)|отсутству|не\s+имеется|сведени\S*\s+(нет|отсутств)|данных\s+нет|информаци\S*\s+(нет|отсутств)|не\s+найдено|(?:^|[^а-яё])нет(?![а-яё])|не\s+выявлено|^\s*-\s*$|(?:^|[^а-яё])низк)/;

function trustScan(lines) {
  const L = lines.map(l => (l.text || "").replace(/\s+/g, " ").trim()).filter(Boolean), low = s => s.toLowerCase().replace(/ё/g, "е");
  const found = {}, info = {};
  for (let i = 0; i < L.length; i++) {
    const t = low(L[i]);
    const rd = /дата\s+(государственной\s+|первичной\s+)?регистрации\D{0,20}(\d{2}\.\d{2}\.\d{4})/.exec(t + " " + low(L[i + 1] || ""));

    if (dir && !info.director) info.director = dir[2];

    const stm = /(^|\s)(статус|состояние)(\s+(юридического\s+лица|компании|налогоплательщика))?\s*[:\-–|]?\s*(.*)$/.exec(t);

      if (rest.length < 2 && L[i + 1]) rest = low(L[i + 1]);

}
function trustSummary(k) {

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2600); }
function paintSaved() { const el = $("#saved"); if (el && lastSaved) el.textContent = "Сохранено в этом браузере, " + lastSaved.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); }
const opts = (list, cur) => list.map(x => `<option${String(x) === String(cur) ? " selected" : ""}>${esc(x)}</option>`).join("");
const stChip = (s, txt) => `<span class="st ${s}">${esc(txt ?? ST[s] ?? "")}</span>`;
const CHK_TXT = { ok: ["ok", "ОК"], bad: ["crit", "Расхождение"], nd: ["nd", "нет данных"], na: ["nd", "—"] };

function render() {
  if (LOCK.on && !LOCK.key) return renderLock();
  if (!C) return renderClients();
  PROB = problems();

  if (!steps.some(st => st[0] === PAGE) && PAGE !== "map" && PAGE !== "log" && PAGE !== "norms") PAGE = "card";

  <div class="app">
    <nav class="rail" aria-label="Разделы">
      <div class="brand">Финансовый анализ<small>компании и группы РК · локально</small></div>

      <div class="foot"><button data-act="export">Сохранить файл клиента</button><span id="saved" class="saved"></span><p class="copy">© 2026 Создан ОФКК Костанай</p></div>
    </nav>
    <main class="main" id="main">${PAGES[PAGE]()}</main>
  </div><div id="toast" class="toast" role="status"></div>${DIALOG}`;
  paintSaved(); paintProblemMarks();
}
function pageProblems(page) { return PROB.filter(p => p.page === page || (page === "cons" && p.page === "elim")); }
function paintProblemMarks() {
  const rank = { crit: 0, risk: 1, chk: 2, nd: 3 };
  document.querySelectorAll("[data-pdot]").forEach(el => {
    const id = el.dataset.pdot;
    const list = id === "prob" ? PROB.filter(p => p.sev !== "nd") : pageProblems(id).filter(p => p.sev !== "nd");
    if (!list.length) { el.className = "pdot"; el.textContent = ""; return; }
    const worst = list.reduce((a, p) => (rank[p.sev] < rank[a] ? p.sev : a), "chk");
    el.className = "pdot " + worst; el.textContent = list.length; el.title = list.length + " — " + SEV[worst].toLowerCase();
  });
  BAD = badCells();
  document.querySelectorAll("td.cell input[data-key]").forEach(inp => markCell(inp, inp.dataset.k + "|" + inp.dataset.key + "|" + inp.dataset.pid));
  document.querySelectorAll("[data-v]").forEach(td => markCell(td, td.dataset.v));
  const b = $("#probBanner"); if (b) b.innerHTML = bannerHTML(b.dataset.page);
}
let BAD = new Map();
function markCell(el, id) {
  const p = BAD.get(id);
  el.classList.toggle("bad", !!p); el.classList.toggle("bad-crit", !!p && p.sev === "crit");
  if (p) el.title = p.title + (p.detail ? " — " + p.detail : "") + "\nЧто сделать: " + p.fix; else if (el.dataset.src) el.title = el.dataset.src; else el.removeAttribute("title");
}
function bannerHTML(page) {
  const list = pageProblems(page).filter(p => !COMP_FILTER || !p.title.startsWith("К") );
  if (!list.length) return "";
  const shown = list.slice(0, 4);
  return `<div class="probs"><div class="probs-h"><b>${list.length === 1 ? "Требует внимания" : "Требуют внимания: " + list.length}</b><button class="btn ghost" data-page="prob">Все проблемы и решения</button></div>
    ${shown.map(probItem).join("")}${list.length > shown.length ? `<p class="small muted">и ещё ${list.length - shown.length} — на странице «Проблемы и решения».</p>` : ""}</div>`;
}
const COMP_FILTER = false;
function probItem(p) {
  return `<div class="prob ${p.sev}"><span class="st ${p.sev}">${SEV[p.sev]}</span><div><b>${esc(p.title)}</b>${p.detail ? `<span class="small muted"> · ${esc(p.detail)}</span>` : ""}<p class="fix">${esc(p.fix)}</p></div></div>`;
}
const DIALOG = `<dialog id="dlg"><div class="dh"><h2 id="dlgT"></h2></div><div class="db" id="dlgB"></div><div class="df" id="dlgF"></div></dialog>`;

/* ---------- ОКЭД на карточке */
function okedHint(code) {
  const d = okedDigits(code); if (!d) return "";
  const r = okedLookup(d);
  if (!r) return "код не найден";
  if (r.divOnly && d.length > 2) return "показано название раздела " + d.slice(0, 2) + " — для точного названия загрузите справочник ОКЭД";
  return r.exact ? "по справочнику" : "по справочнику (ближайший уровень " + okedFmt(d.slice(0, r.level)) + ")";
}
function okedPanel() {
  if (!C.card.oked || !C.card.oked.length) C.card.oked = [{ code: "", name: "" }];
  const n = Object.keys(OKED).length;
  const rows = C.card.oked.map((o, i) => {
    const nm = o.manual ? o.name : (okedLookup(o.code)?.name || o.name || "");
    return `<tr><td class="lab">${i === 0 ? "Основной" : "Доп. " + i}</td>
      <td><input class="inp" data-oked="${i}" data-f="code" value="${esc(o.code)}" placeholder="например, 46.90.0" inputmode="numeric" style="max-width:150px"></td>
      <td><input class="inp" data-oked="${i}" data-f="name" value="${esc(nm)}" placeholder="наименование подставится по коду"><span class="small muted" data-okedhint="${i}">${esc(okedHint(o.code))}</span></td>
      <td>${C.card.oked.length > 1 ? `<button class="btn ghost danger" data-deloked="${i}">Удалить</button>` : ""}</td></tr>`;
  }).join("");
  return `<section class="panel"><h2>Виды деятельности (ОКЭД)</h2><p class="hint">До ${MAX_OKED} кодов на клиента; первый — основной. Наименование подставляется по коду, его можно поправить вручную. ${n ? `Справочник ОКЭД загружен: ${nf0.format(n)} кодов.` : "Сейчас встроены только разделы (первые 2 цифры). Чтобы подтягивались точные наименования, один раз загрузите справочник ОКЭД на странице «Настройка загрузки»."}</p>
    <div class="tablewrap" style="max-height:none"><table class="data form oked"><thead><tr><th class="lab">Вид</th><th style="text-align:left">Код ОКЭД</th><th style="text-align:left">Наименование</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    ${C.card.oked.length < MAX_OKED ? `<p style="margin-top:10px"><button class="btn" data-act="addoked">Добавить код ОКЭД</button></p>` : ""}</section>`;
}

/* ---------- отчётность компании */
function linesTable(obj, blocks, editable) {
  const pers = C.periods;
  let h = `<div class="tablewrap"><table class="data"><thead><tr><th class="lab">Показатель, тыс. тг</th>${pers.map(p => `<th>${esc(p.label)}<span class="pertitle">${esc(p.basis === "Годовой" ? "год" : p.basis.toLowerCase())}${p.months !== 12 ? ", " + p.months + " мес." : ""}</span></th>`).join("")}</tr></thead><tbody>`;
  for (const b of blocks) for (const [typ, key, label] of LINES[b]) {
    if (!key) { h += `<tr class="sec"><td class="lab" colspan="${pers.length + 1}">${esc(label)}</td></tr>`; continue; }
    const code = "";
    const sub = /^в т\.ч\./.test(label) || (CF_CODE[key] && typ === "opt" && !["cf120", "cf140", "cf150r"].includes(key)) ? " sub" : "";
    h += `<tr class="${typ === "calc" ? "calc" : ""}${sub}"><td class="lab">${code}${esc(label)}${typ === "opt" && !CF_CODE[key] ? ' <span class="small muted">(необяз.)</span>' : ""}</td>`;
    for (const p of pers) {
      if (typ !== "calc" && editable) {
        const v = rawComp(obj, key, p.id), src = C.src?.[obj]?.[key]?.[p.id];
        h += `<td class="cell${typ === "opt" ? " opt" : ""}"><input data-k="${obj}" data-key="${key}" data-pid="${p.id}" value="${esc(fmt(v))}" class="${src ? "imp" : ""}" ${src ? `data-src="${esc("Загружено: " + src.form + ", " + src.file + " — " + src.status)}"` : ""} aria-label="${esc(label + ", " + p.label)}"></td>`;
      } else {
        const v = val(obj, key, p.id);
        h += `<td class="${isNum(v) && v < 0 ? "neg" : ""}" data-v="${obj}|${key}|${p.id}">${fmt(v)}</td>`;
      }
    }
    h += "</tr>";
  }
  return h + "</tbody></table></div>";
}

}

function riskSummary(obj) {
  const L = lastPid(), cnt = { ok: 0, chk: 0, risk: 0, crit: 0, nd: 0 };
  for (const key of Object.keys(RAT)) { const s = rstatus(key, ratio(obj, key, L)); if (s) cnt[s]++; }
  let disc = discrepancies();
  if ((C.decl || []).length || (C.bank || []).length) for (let k = 1; k <= nComp(); k++) disc += taxChecks(k, C.periods[perIdx(L)] || C.periods[0]).filter(c => c.st === "risk").length;
  let miss = 0; for (let k = 1; k <= nComp(); k++) miss += missingInputs(k, L);
  const ind = miss > 0 ? ["nd", "Недостаточно данных"] : cnt.crit > 0 ? ["crit", "Критический риск"] : (cnt.risk > 0 || cnt.chk >= 3 || disc > 0) ? ["chk", "Умеренный риск — требует проверки"] : ["ok", "Приемлемый риск"];
  return { cnt, disc, miss, ind };
}

/* ---------- периоды: год и квартал */
function perQ(p) {   // квартал, если дата — конец квартала и период не годовой
  const m = /^\d{4}-(\d{2})-(\d{2})$/.exec(p.date || ""); if (!m) return "";
  const ends = { "03-31": 1, "06-30": 2, "09-30": 3, "12-31": 4 }, q = ends[m[1] + "-" + m[2]];
  if (!q) return "";
  if (p.basis === "Годовой" || p.basis === "LTM") return "";
  return "Q" + q;
}
function setPeriod(p, y, q) {
  if (!q) { p.date = `${y}-12-31`; if (p.basis !== "LTM") p.basis = "Годовой"; p.months = 12; p.label = String(y); return; }
  const n = +q[1], end = ["03-31", "06-30", "09-30", "12-31"][n - 1];
  p.date = `${y}-${end}`;
  if (p.basis === "Годовой" || p.basis === "LTM" || !p.basis) p.basis = "Нарастающим итогом";
  const sep = p.basis === "Отдельный период";
  p.months = sep ? 3 : 3 * n;
  p.label = sep ? `${n} кв. ${y}` : n === 4 ? `12 мес. ${y}` : `${3 * n} мес. ${y}`;
}

// роли компании (можно несколько): заёмщик и залогодатель, гарант и залогодатель и т.д.
function compRoles(x) { if (Array.isArray(x.roles) && x.roles.length) return x.roles; return String(x.role || "").split(/\s*,\s*/).filter(Boolean); }
